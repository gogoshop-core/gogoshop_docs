
    <!DOCTYPE html>
    <html>
      <head>
        <title>openapi API 文件</title>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <link
          href="https://fonts.googleapis.com/css?family=Montserrat:300,400,700|Roboto:300,400,700"
          rel="stylesheet"
        />
        <style>
          body {
            margin: 0;
            padding: 0;
          }
        </style>
      </head>
      <body>
        <div id="redoc-container"></div>
        <script>    
          function initializeRedoc() {
            const schemaFile = './openapi.yaml';
            const options = {
              untrustedSpec: true
            };
    
            Redoc.init(
              schemaFile,
              options,
              document.getElementById('redoc-container')
            );
          }
      </script>
      <script
        src="./redoc.standalone.js"
        onload="initializeRedoc()"
      ></script>
      </body>
    </html>
