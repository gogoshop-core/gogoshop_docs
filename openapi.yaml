openapi: "3.1.0"

info:
  title: GOGOSHOP API
  version: "1.0.0"
  description: |
    ## 概述
    GOGOSHOP 是一個 SaaS 多租戶電商平台。本文件涵蓋以下公開 API 端點：

    - **`/api/v1/auth/*`** — 身份驗證，取得 JWT Access Token
    - **`/api/v1/orders/*`** — 訂單管理 CRUD 與進階操作
    - **`/api/v1/products/*`** — 商品管理 CRUD
    - **`/api/v1/members/*`** — 會員管理、購物金、積分、願望清單
    - **`/api/v1/stats/*`** — 報表統計（營業額、活動代碼、會員排名、商品排名）
    - **`/mcp`** — Model Context Protocol (MCP) 端點，供 AI Agent 使用

    ### 1. 基礎資訊 (Base URL)

    所有 API 請求都應發送到以下基礎 URL：

    - **正式環境**: `https://api.gogoshop.io`

    ### 2. 認證機制 (Authentication)

    本 API 採用 **Bearer Token (JWT)** 進行身份驗證。

    - **Header 名稱**: `Authorization`
    - **格式**: `Bearer {{accessToken}}`

    **認證流程**：

    1. 呼叫 `POST /api/v1/auth/access_token`，使用 `app_id` + `app_key` 換取 JWT Token。
    2. 後續所有 `/api/v1/*` 請求，在 `X-Authorization` header 帶入 `Bearer <token>`。
    3. Token 有效期為 **15 分鐘（900 秒）**，請自行實作 Token 自動刷新機制。

    **示例**：

    ```bash
    curl -X GET https://api.gogoshop.io/api/v1/orders \
      -H "X-Authorization: Bearer sYpX...456"
    ```

    > **MCP 端點例外**：`/mcp` 不使用 Bearer Token，改以自訂 Header
    > `x-gogoshop-app-id` / `x-gogoshop-app-key` 進行租戶認證，
    > 由 MCP Server 內部自動換取並快取 Access Token。

    ### 3. 速率限制 (Rate Limiting)

    為了保證服務穩定性，我們對 API 請求進行了頻率限制：

    - **限制規則**: 依租戶方案而定，詳情請洽技術支援。
    - **超過限制**: 若超過頻率，伺服器將回傳 `429 Too Many Requests` 錯誤。

    ### 4. 數據格式 (Data Format)

    - **請求格式**: `application/json`（除特定文件上傳接口外）
    - **回應格式**: `application/json`
    - **日期格式**: 使用 ISO 8601 格式，例如 `YYYY-MM-DD HH:mm:ss`（UTC+8）

    ### 5. 通用狀態碼 (Common Status Codes)

    | 狀態碼 | 說明 | 處理建議 |
    |--------|------|----------|
    | `200` | OK | 請求成功 |
    | `400` | Bad Request | 請求參數錯誤，請檢查 Body 或 Params |
    | `401` | Unauthorized | 身份驗證失敗或 Token 已過期 |
    | `409` | Conflict | 程式符合規範但業務邏輯不允許 |
    | `429` | Too Many Requests | 觸發速率限制，請稍候再試 |
    | `500` | Internal Server Error | 伺服器內部錯誤，請聯繫技術支援 |

    ### 6. 錯誤回應範例 (Error Response)

    當請求失敗時，系統將回傳統一的錯誤格式：

    ```json
    {
        "success": false,
        "error": {
            "code": "VALIDATION_FAILED",
            "message": "手機號碼格式不正確",
            "details": []
        }
    }
    ```

    ### 7. 聯絡技術支援

    如果您在開發過程中遇到任何問題，請透過以下管道聯繫：

    - **Email**: service@gogoshop.io

  contact:
    name: GOGOSHOP 技術支援
    url: https://www.gogoshop.io
    email: service@gogoshop.io
  license:
    name: Proprietary

servers:
  - url: https://api.gogoshop.io
    description: Production

tags:
  - name: Auth
    description: 身份驗證 — 取得與更新 JWT Access Token
  - name: Orders
    description: 訂單管理 — CRUD、取消、開立發票、建立出貨單
  - name: Products
    description: 商品管理 — CRUD
  - name: Members
    description: 會員管理 — CRUD、購物金、積分、地址、願望清單
  - name: Stats
    description: 報表 — 營業額、活動代碼、會員排名、商品排名統計
  - name: MCP
    description: Model Context Protocol — AI Agent 整合端點

# ─── Security Schemes ────────────────────────────────────────────────────────
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT Token，透過 `POST /api/v1/auth/access_token` 取得。
        有效期 15 分鐘，請自行實作刷新邏輯。
    AppIdHeader:
      type: apiKey
      in: header
      name: x-gogoshop-app-id
      description: 租戶 App ID（僅用於 `/mcp` 端點）
    AppKeyHeader:
      type: apiKey
      in: header
      name: x-gogoshop-app-key
      description: 租戶 App Key（僅用於 `/mcp` 端點）

  # ─── Reusable Schemas ─────────────────────────────────────────────────────────
  schemas:

    # ── Generic ────────────────────────────────────────────────────────────────
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
      required:
        - success

    ErrorResponse:
      type: object
      required:
        - success
        - error
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              description: 錯誤代碼（SCREAMING_SNAKE_CASE）
              enum:
                - VALIDATION_FAILED
                - RESOURCE_NOT_FOUND
                - PERMISSION_DENIED
                - UNAUTHORIZED
                - BUSINESS_LOGIC_ERROR
                - INTERNAL_SERVER_ERROR
              example: VALIDATION_FAILED
            message:
              type: string
              description: 人類可讀錯誤描述（給開發者閱讀）
              example: "Invalid fields"
            details:
              type: array
              items:
                type: object
              description: 選用，提供欄位層級的驗證錯誤細節
              example: []

    Pagination:
      type: object
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 50

    # ── Stats ──────────────────────────────────────────────────────────────────
    StatsPagination:
      type: object
      properties:
        sort:
          type: string
          example: total_amount
        direction:
          type: string
          example: desc
        page:
          type: integer
          example: 1
        total_count:
          type: integer
          example: 42
        limit:
          type: integer
          example: 20
        page_count:
          type: integer
          example: 3

    # ── Auth ───────────────────────────────────────────────────────────────────
    AccessTokenResponse:
      type: object
      required:
        - success
        - access_token
        - token_type
        - expires_in
      properties:
        success:
          type: boolean
          example: true
        access_token:
          type: string
          description: RS256 簽署的 JWT Token
          example: "eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9..."
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          description: Token 有效秒數
          example: 900

    # ── Product ────────────────────────────────────────────────────────────────
    ProductState:
      type: string
      enum:
        - published
        - publish_check
        - cancelled
      description: 商品狀態

    ProductQuantityMode:
      type: string
      enum:
        - stock
        - warehouse
        - unlimited
      description: 庫存扣減模式

    ProductInput:
      type: object
      description: 建立或更新商品時使用的欄位（camelCase）
      properties:
        type:
          type: string
          description: 商品類型
          example: "physical"
        state:
          $ref: "#/components/schemas/ProductState"
        quantityMode:
          $ref: "#/components/schemas/ProductQuantityMode"
        name:
          type: string
          description: 商品名稱
          example: "經典白 T-shirt"
        serialNumber:
          type: string
          description: 商品序號
          example: "SKU-001"
        cost:
          type: number
          description: 商品成本
          example: 200
        safetyStock:
          type: number
          description: 安全庫存量
          example: 10
        leadTime:
          type: integer
          minimum: 0
          description: 預備出貨天數（非負整數）
          example: 3
        variant:
          type: string
          description: 商品規格說明
          example: "顏色:白 / 尺寸:M"
        description:
          type: string
          description: 商品描述（支援 HTML）
        published:
          oneOf:
            - type: boolean
            - type: string
              format: date-time
          description: 上架狀態或上架時間
          example: true
        cancelled:
          oneOf:
            - type: boolean
            - type: string
              format: date-time
          description: 下架狀態或下架時間
          example: false

    ProductStock:
      type: object
      description: 商品庫存（規格 SKU）
      properties:
        id:
          type: string
        serial_number:
          type: string
          example: "SKU-001-WHITE-M"
        variant:
          type: string
          example: "顏色:白 / 尺寸:M"
        image:
          type: string
          nullable: true
        original_price:
          type: number
          example: 500
        selling_price:
          type: number
          example: 450
        quantity:
          type: integer
          example: 10

    Product:
      type: object
      description: 商品資源（snake_case，後端回傳格式）
      properties:
        id:
          type: string
          pattern: "^[a-f0-9]{16}$"
          description: 商品 ID（16 位十六進位）
          example: "1a2b3c4d5e6f7890"
        number:
          type: string
          description: 商品序號
          example: "SKU-001"
        name:
          type: string
          example: "經典白 T-shirt"
        state:
          $ref: "#/components/schemas/ProductState"
        cost:
          type: number
          example: 200
        min_price:
          type: number
          nullable: true
          description: 各規格中的最低售價
          example: 450
        max_price:
          type: number
          nullable: true
          description: 各規格中的最高售價
          example: 500
        review_count:
          type: integer
          description: 評論數量
          example: 0
        avg_rating:
          type: number
          nullable: true
          description: 平均評分
          example: 4.5
        safety_stock:
          type: number
          example: 10
        lead_time:
          type: integer
          description: 預備出貨天數
          example: 3
        description:
          type: string
        variant:
          type: string
          example: "顏色:白 / 尺寸:M"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        published_at:
          oneOf:
            - type: boolean
            - type: string
              format: date-time
          description: 上架狀態或上架時間
        cancelled_at:
          oneOf:
            - type: boolean
            - type: string
              format: date-time
          description: 下架狀態或下架時間
        sort:
          type: integer
          example: 0
        quantity_mode:
          $ref: "#/components/schemas/ProductQuantityMode"
        quantity_limit:
          type: integer
          nullable: true
          description: 限購數量
        fixed_price:
          type: boolean
          description: 是否為固定售價（不因規格而異）
        search_disabled:
          type: boolean
          description: 是否從搜尋結果中隱藏
        link:
          type: string
          nullable: true
        url_path:
          type: string
          example: "classic-white-tshirt"
        vendor_number:
          type: string
          nullable: true
        marketing_label:
          type: string
          nullable: true
        media:
          type: integer
          nullable: true
        media_id:
          type: string
          nullable: true
        limited_selections:
          type: string
          nullable: true
        comment_required:
          type: boolean
          description: 是否必須填寫留言
        comment:
          type: string
        keywords:
          type: string
        meta_description:
          type: string
        settings:
          type: object
          additionalProperties: true
          description: 商品其他設定（結構依商品類型而異）
        images:
          type: array
          items:
            type: string
        stocks:
          type: array
          items:
            $ref: "#/components/schemas/ProductStock"
        score:
          type: number
          nullable: true

    ProductDetail:
      allOf:
        - $ref: "#/components/schemas/Product"
        - type: object
          description: 詳細商品（含 additions、tags、product_items）
          properties:
            additions:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                  number:
                    type: string
                  name:
                    type: string
                  state:
                    $ref: "#/components/schemas/ProductState"
                  variant:
                    type: string
                  quantity_mode:
                    $ref: "#/components/schemas/ProductQuantityMode"
                  quantity_limit:
                    type: integer
                    nullable: true
                  vendor_number:
                    type: string
                    nullable: true
                  marketing_label:
                    type: string
                    nullable: true
                  comment_required:
                    type: boolean
                  comment:
                    type: string
                  settings:
                    type: object
                    additionalProperties: true
                  images:
                    type: array
                    items:
                      type: string
                  stocks:
                    type: array
                    items:
                      $ref: "#/components/schemas/ProductStock"
            tags:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  code:
                    type: string
            product_items:
              type: array
              items:
                type: object
                description: 商品款式（SKU）
                properties:
                  id:
                    type: string
                  title:
                    type: string
                  content:
                    type: string

    # ── Order ──────────────────────────────────────────────────────────────────
    OrderState:
      type: string
      enum:
        - un_pay
        - cod
        - pay
        - failure
        - cancel
      description: 訂單狀態

    OrderLineItemState:
      type: string
      enum:
        - build
        - done
        - cancel
        - failure
      description: 訂單品項狀態

    OrderLineItem:
      type: object
      description: 訂單品項
      properties:
        id:
          type: string
        product_id:
          type: string
          example: "1a2b3c4d5e6f7890"
        stock_id:
          type: string
        serial_number:
          type: string
          example: "SKU-001-WHITE-M"
        name:
          type: string
          example: "經典白 T-shirt"
        state:
          $ref: "#/components/schemas/OrderLineItemState"
        delivering_quantity:
          type: integer
          example: 0
        delivered_quantity:
          type: integer
          example: 0
        refunding_quantity:
          type: integer
          example: 0
        refunded_quantity:
          type: integer
          example: 0
        quantity:
          type: integer
          example: 2
        original_price:
          type: integer
          example: 500
        selling_price:
          type: integer
          example: 500
        discount:
          type: integer
          example: 0
        price:
          type: integer
          example: 500
        cash:
          type: integer
          example: 0
        amount:
          type: integer
          example: 1000
        comment:
          type: string
          nullable: true
        cancel:
          type: string
          nullable: true
          description: 取消原因（品項被取消時填寫）
        processed_at:
          type: string
          format: date-time
          nullable: true
        delivered_at:
          type: string
          format: date-time
          nullable: true
        cancelled_at:
          type: string
          format: date-time
          nullable: true
        image:
          type: string
          nullable: true
          description: 品項圖片（僅在 require_image 情境下回傳）

    Order:
      type: object
      properties:
        id:
          type: string
          pattern: "^[a-f0-9]{24}$"
          description: 訂單 ID（24 位十六進位）
          example: "5f4dcc3b5aa765d61d8327de"
        number:
          type: string
          description: 訂單編號（人類可讀）
          example: "ORD-20260823-0001"
        state:
          $ref: "#/components/schemas/OrderState"
        currency:
          type: string
          description: 幣別代碼
          example: "TWD"
        amount:
          type: integer
          description: 訂單總金額
          example: 1060
        fee:
          type: integer
          description: 運費
          example: 60
        payment_fee:
          type: integer
          description: 金流手續費
          example: 0
        accounts:
          type: integer
          description: 已請款/入帳金額
          example: 1060
        comment:
          type: string
        buyer:
          type: object
          properties:
            name:
              type: string
              example: "王小明"
            mobile:
              type: string
              example: "0912345678"
            email:
              type: string
              format: email
              example: "buyer@example.com"
            billing:
              type: object
              properties:
                invoice_type:
                  type: string
                  nullable: true
                invoice_title:
                  type: string
                  nullable: true
                invoice_address:
                  type: string
                  nullable: true
                carrier_type:
                  type: string
                  nullable: true
                carrier_id:
                  type: string
                  nullable: true
                tax_number:
                  type: string
                  nullable: true
        receiver:
          type: object
          properties:
            name:
              type: string
              example: "王小明"
            mobile:
              type: string
              example: "0912345678"
            location:
              type: object
              properties:
                country:
                  type: string
                  example: "TW"
                city:
                  type: string
                  example: "臺北市"
                district:
                  type: string
                  example: "信義區"
                zip:
                  type: string
                  example: "110"
                address:
                  type: string
                  example: "信義路五段7號"
                province:
                  type: string
                  nullable: true
        transaction:
          type: object
          properties:
            payment_gateway:
              type: string
              example: "PAYUNi"
            payment_type:
              type: string
              example: "credit_card"
            payment_fee:
              type: integer
              example: 0
            payment_deadline:
              type: string
              format: date-time
              nullable: true
            payment_bank_code:
              type: string
              nullable: true
            payment_code:
              type: string
              nullable: true
            payment_info:
              type: object
              nullable: true
              additionalProperties: true
        shipping:
          type: object
          properties:
            delivery_type:
              type: string
              example: "home_delivery"
            delivery_name:
              type: string
              example: "黑貓宅配"
            fare:
              type: integer
              example: 60
            receive_date:
              type: string
              nullable: true
            receive_time:
              type: string
              nullable: true
            pickup_store:
              type: object
              nullable: true
              description: 超商/門市取貨資訊，非取貨時為 null
              properties:
                id:
                  type: string
                type:
                  type: string
                name:
                  type: string
                address:
                  type: string
        line_items:
          type: array
          items:
            $ref: "#/components/schemas/OrderLineItem"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        paid_at:
          type: string
          format: date-time
          nullable: true
        delivered_at:
          type: string
          format: date-time
          nullable: true
        deliveries:
          type: array
          items:
            type: object
            additionalProperties: true
        refunds:
          type: array
          items:
            type: object
            additionalProperties: true

    OrderInput:
      type: object
      description: 建立或更新訂單時使用
      properties:
        member_id:
          type: string
          description: 會員 ID（可選，匿名購物時省略）
        receiver_name:
          type: string
        receiver_mobile:
          type: string
        receiver_country:
          type: string
        receiver_city:
          type: string
        receiver_district:
          type: string
        receiver_zip:
          type: string
        receiver_address:
          type: string
        delivery_type:
          type: string
        delivery_name:
          type: string
        payment_gateway:
          type: string
        payment_type:
          type: string
        note:
          type: string
        order_items:
          type: array
          items:
            type: object
            required:
              - stock_id
              - quantity
            properties:
              stock_id:
                type: string
              quantity:
                type: integer
                minimum: 1

    # ── Member ─────────────────────────────────────────────────────────────────
    MemberType:
      type: string
      enum:
        - guest
        - member
        - blacklist
      description: 會員類型

    MemberInvoiceInfo:
      type: object
      properties:
        invoice_type:
          type: string
          nullable: true
        invoice_carrier_type:
          type: string
          nullable: true
        invoice_carrier_id:
          type: string
          nullable: true
        tax_number:
          type: string
          nullable: true
        invoice_title:
          type: string
          nullable: true
        invoice_address:
          type: string
          nullable: true

    Member:
      type: object
      properties:
        id:
          type: string
          pattern: "^[a-f0-9]{24}$"
          description: 會員 ID（24 位十六進位）
          example: "5f4dcc3b5aa765d61d8327de"
        email:
          type: string
          format: email
          example: "member@example.com"
        type:
          $ref: "#/components/schemas/MemberType"
        newsletter:
          type: boolean
          description: 是否訂閱電子報
        name:
          type: string
          example: "王小明"
        mobile:
          type: string
          example: "0912345678"
        gender:
          type: string
          nullable: true
        birth_year:
          type: string
          example: "1990"
        birth_month:
          type: string
          example: "1"
        birth_day:
          type: string
          example: "15"
        invoice_info:
          $ref: "#/components/schemas/MemberInvoiceInfo"
        custom_1:
          type: string
          nullable: true
        custom_2:
          type: string
          nullable: true
        custom_3:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    MemberInput:
      type: object
      description: 建立或更新會員時使用
      properties:
        email:
          type: string
          format: email
        name:
          type: string
        mobile:
          type: string
        birth_date:
          type: string
          format: date
        gender:
          type: string
          enum:
            - male
            - female
            - other
        country:
          type: string
        city:
          type: string
        district:
          type: string
        address:
          type: string

    CashRecord:
      type: object
      properties:
        id:
          type: string
        amount:
          type: integer
          description: 金額（正數為入帳，負數為扣款）
          example: 100
        balance:
          type: integer
          description: 操作後餘額
          example: 500
        reason:
          type: string
          nullable: true
          example: "促銷活動贈送"
        expired_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time

    PointRecord:
      type: object
      properties:
        id:
          type: string
        points:
          type: integer
          description: 積分異動量（正為獲得，負為使用）
          example: 50
        balance:
          type: integer
          description: 操作後積分餘額
          example: 200
        reason:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time

    Address:
      type: object
      properties:
        receiver:
          type: object
          properties:
            name:
              type: string
            mobile:
              type: string
            location:
              type: object
              properties:
                country:
                  type: string
                city:
                  type: string
                district:
                  type: string
                zip:
                  type: string
                address:
                  type: string
                province:
                  type: string
                  nullable: true
        shipping:
          type: object
          properties:
            delivery_type:
              type: string
            delivery_name:
              type: string
            fare:
              type: integer
            receive_date:
              type: string
              format: date
              nullable: true
            receive_time:
              type: string
              nullable: true
            pickup_store:
              type: object
              nullable: true
              properties:
                id:
                  type: string
                type:
                  type: string
                name:
                  type: string
                address:
                  type: string

    WishlistItem:
      type: object
      properties:
        id:
          type: string
          pattern: "^[a-f0-9]{24}$"
          description: 願望清單 ID
        product_id:
          type: string
          pattern: "^[a-f0-9]{16}$"
        created_at:
          type: string
          format: date-time

    # ── Delivery ───────────────────────────────────────────────────────────────
    DeliveryInput:
      type: object
      properties:
        delivery_type:
          type: string
          example: "home_delivery"
        delivery_name:
          type: string
          example: "黑貓宅配"
        tracking_number:
          type: string
          nullable: true
        more_params:
          type: object
          description: 物流供應商額外參數（依供應商不同而異）

    Delivery:
      type: object
      properties:
        id:
          type: string
          pattern: "^[a-f0-9]{24}$"
        order_id:
          type: string
          pattern: "^[a-f0-9]{24}$"
        delivery_type:
          type: string
        delivery_name:
          type: string
        tracking_number:
          type: string
          nullable: true
        status:
          type: string
        created_at:
          type: string
          format: date-time

    # ── Cart / Bag ─────────────────────────────────────────────────────────────
    CartItem:
      type: object
      properties:
        id:
          type: string
          description: 購物車項目 ID
        stock_id:
          type: string
        product_id:
          type: string
          pattern: "^[a-f0-9]{16}$"
        product_name:
          type: string
        quantity:
          type: integer
        unit_price:
          type: integer
        comment:
          type: string
          nullable: true

  # ── Reusable Parameters ──────────────────────────────────────────────────────
  parameters:
    PageParam:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
      description: 頁碼

    LimitParam:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        default: 50
      description: 每頁筆數

    MemberIdPath:
      name: id
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-f0-9]{24}$"
      description: 會員 ID（24 位十六進位字串）

    OrderIdPath:
      name: id
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-f0-9]{24}$"
      description: 訂單 ID（24 位十六進位字串）

    ProductIdPath:
      name: id
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-f0-9]{16}$"
      description: 商品 ID（16 位十六進位字串）

  # ── Reusable Responses ───────────────────────────────────────────────────────
  responses:
    Unauthorized:
      description: 身份認證失敗
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            error:
              code: UNAUTHORIZED
              message: "Token is expired or missing"
              details: []

    BadRequest:
      description: 請求參數錯誤或資源不存在
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            error:
              code: VALIDATION_FAILED
              message: "Invalid fields"
              details: []

    InternalError:
      description: 伺服器內部錯誤
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            error:
              code: INTERNAL_SERVER_ERROR
              message: "An unexpected error occurred"
              details: []

# ─── Global Security ──────────────────────────────────────────────────────────
security:
  - BearerAuth: []

# ─── Paths ────────────────────────────────────────────────────────────────────
paths:

  # ════════════════════════════════════════════════════════════════════════════
  # AUTH
  # ════════════════════════════════════════════════════════════════════════════

  /api/v1/auth/access_token:
    post:
      tags:
        - Auth
      summary: 取得 Access Token
      description: |
        使用 `app_id` 與 `app_key` 換取 JWT Bearer Token。
        Token 有效期為 **900 秒（15 分鐘）**，請在到期前呼叫本端點取得新 Token。

        **此端點本身不需要 Bearer Token 認證**。
      operationId: auth_access_token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - app_id
                - app_key
              properties:
                app_id:
                  type: string
                  description: 應用程式 ID
                  example: "{{appId}}"
                app_key:
                  type: string
                  description: 應用程式 API Key（請勿記錄於 log）
                  example: "{{appKey}}"
            example:
              app_id: "abc12345678def01"
              app_key: "sk_live_xxxxxxxxxxxxxxxxxxxxxxxx"
      responses:
        "200":
          description: 成功取得 Token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessTokenResponse"
              example:
                success: true
                access_token: "eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9..."
                token_type: Bearer
                expires_in: 900
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  # ════════════════════════════════════════════════════════════════════════════
  # PRODUCTS
  # ════════════════════════════════════════════════════════════════════════════

  /api/v1/products:
    get:
      tags:
        - Products
      summary: 取得商品列表
      description: 依分頁取得商品列表。
      operationId: list_products
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/LimitParam"
        - name: created_at_min
          in: query
          schema:
            type: string
            pattern: '^\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01]) ([01]\d|2[0-3]):[0-5]\d:[0-5]\d$'
          description: 建立時間下限（YYYY-MM-DD HH:MM:SS）
        - name: created_at_max
          in: query
          schema:
            type: string
            pattern: '^\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01]) ([01]\d|2[0-3]):[0-5]\d:[0-5]\d$'
          description: 建立時間上限（YYYY-MM-DD HH:MM:SS）
        - name: updated_at_min
          in: query
          schema:
            type: string
            pattern: '^\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01]) ([01]\d|2[0-3]):[0-5]\d:[0-5]\d$'
          description: 修改時間下限（YYYY-MM-DD HH:MM:SS）
        - name: updated_at_max
          in: query
          schema:
            type: string
            pattern: '^\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01]) ([01]\d|2[0-3]):[0-5]\d:[0-5]\d$'
          description: 修改時間上限（YYYY-MM-DD HH:MM:SS）
        - name: published_at_min
          in: query
          schema:
            type: string
            pattern: '^\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01]) ([01]\d|2[0-3]):[0-5]\d:[0-5]\d$'
          description: 上架時間下限（YYYY-MM-DD HH:MM:SS）
        - name: published_at_max
          in: query
          schema:
            type: string
            pattern: '^\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01]) ([01]\d|2[0-3]):[0-5]\d:[0-5]\d$'
          description: 上架時間上限（YYYY-MM-DD HH:MM:SS）
        - name: ids
          in: query
          schema:
            type: string
            pattern: "^[0-9a-f,]+$"
          description: 依商品 ID 篩選，多筆以逗號分隔（16 位十六進位）
          example: "1a2b3c4d5e6f7890,1a2b3c4d5e6f7891"
        - name: numbers
          in: query
          schema:
            type: string
          description: 依商品編號篩選，多筆以逗號分隔
          example: "SKU-001,SKU-002"
        - name: state
          in: query
          schema:
            type: string
            enum:
              - published
              - publish_check
              - cancelled
          description: |
            依商品狀態篩選，多筆以逗號分隔。
            `published`（已上架）、`publish_check`（待上架）、`cancelled`（已下架）。
          example: "published"
        - name: category
          in: query
          schema:
            type: string
          description: 依商品分類篩選，可為 Tag ID（16 位十六進位）或 Tag Code
        - name: query
          in: query
          schema:
            type: string
          description: 搜尋關鍵字
        - name: search_mode
          in: query
          schema:
            type: string
            enum:
              - literal
              - advanced
              - hybrid
              - vector
            default: advanced
          description: 搜尋模式（僅在提供 query 參數時有效）
        - name: search_disabled
          in: query
          schema:
            type: string
            enum:
              - "0"
              - "1"
              - "false"
              - "true"
          description: 依是否停用搜尋篩選
        - name: order
          in: query
          schema:
            type: string
            enum:
              - price_desc
              - price_asc
              - time_desc
              - time_asc
              - published
              - hot
              - sort_asc
              - sort_desc
              - rand
              - rating_desc
              - score
          description: 排序方式
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  products:
                    type: array
                    items:
                      $ref: "#/components/schemas/Product"
                  pagination:
                    $ref: "#/components/schemas/Pagination"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

    post:
      tags:
        - Products
      summary: 新增商品
      description: |
        建立新商品。

        必填欄位：`type`、`state`、`quantityMode`、`name`、`serialNumber`。
        缺少任一者後端會回傳 `status: false`（HTTP 仍為 200）。
      operationId: create_product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - product
              properties:
                product:
                  $ref: "#/components/schemas/ProductInput"
            example:
              product:
                type: physical
                state: active
                quantityMode: limited
                name: "經典白 T-shirt"
                serialNumber: "SKU-001"
                cost: 200
                safetyStock: 10
                leadTime: 2
      responses:
        "200":
          description: 新增成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: true
                  product:
                    $ref: "#/components/schemas/Product"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/products/{idOrLink}:
    get:
      tags:
        - Products
      summary: 取得單一商品詳細資訊
      description: |
        `idOrLink` 可為商品 ID（16 位十六進位）或商品的 `url_path`。
        回應為 detail 模式，包含 `additions`、`tags`、`product_items`。
      operationId: get_product
      parameters:
        - name: idOrLink
          in: path
          required: true
          schema:
            type: string
          description: 商品 ID（16 位十六進位）或 url_path
          example: "1a2b3c4d5e6f7890"
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  product:
                    $ref: "#/components/schemas/ProductDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/products/{id}:
    put:
      tags:
        - Products
      summary: 更新商品
      description: |
        更新指定商品。只需傳入要更新的欄位，未傳入的欄位不會被修改。
        `id` 必須為 16 位十六進位字串（`[a-f0-9]{16}`）。
      operationId: update_product
      parameters:
        - $ref: "#/components/parameters/ProductIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - product
              properties:
                product:
                  $ref: "#/components/schemas/ProductInput"
            example:
              product:
                state: inactive
                name: "經典白 T-shirt（改款）"
      responses:
        "200":
          description: 更新成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: true
                  product:
                    $ref: "#/components/schemas/Product"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

    delete:
      tags:
        - Products
      summary: 刪除商品
      description: |
        刪除指定商品。`id` 必須為 16 位十六進位字串。
      operationId: delete_product
      parameters:
        - $ref: "#/components/parameters/ProductIdPath"
      responses:
        "200":
          description: 刪除成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  # ════════════════════════════════════════════════════════════════════════════
  # ORDERS
  # ════════════════════════════════════════════════════════════════════════════

  /api/v1/orders:
    get:
      tags:
        - Orders
      summary: 取得訂單列表
      description: 依分頁與篩選條件取得訂單列表。
      operationId: list_orders
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/LimitParam"
        - name: created_at_min
          in: query
          schema:
            type: string
            pattern: '^\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01]) ([01]\d|2[0-3]):[0-5]\d:[0-5]\d$'
          description: 建立時間下限（YYYY-MM-DD HH:MM:SS）
        - name: created_at_max
          in: query
          schema:
            type: string
            pattern: '^\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01]) ([01]\d|2[0-3]):[0-5]\d:[0-5]\d$'
          description: 建立時間上限（YYYY-MM-DD HH:MM:SS）
        - name: updated_at_min
          in: query
          schema:
            type: string
            pattern: '^\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01]) ([01]\d|2[0-3]):[0-5]\d:[0-5]\d$'
          description: 修改時間下限（YYYY-MM-DD HH:MM:SS）
        - name: updated_at_max
          in: query
          schema:
            type: string
            pattern: '^\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01]) ([01]\d|2[0-3]):[0-5]\d:[0-5]\d$'
          description: 修改時間上限（YYYY-MM-DD HH:MM:SS）
        - name: paid_at_min
          in: query
          schema:
            type: string
            pattern: '^\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01]) ([01]\d|2[0-3]):[0-5]\d:[0-5]\d$'
          description: 付款時間下限（YYYY-MM-DD HH:MM:SS）
        - name: paid_at_max
          in: query
          schema:
            type: string
            pattern: '^\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01]) ([01]\d|2[0-3]):[0-5]\d:[0-5]\d$'
          description: 付款時間上限（YYYY-MM-DD HH:MM:SS）
        - name: ids
          in: query
          schema:
            type: string
            pattern: "^[0-9a-f,]+$"
          description: 依訂單 ID 篩選，多筆以逗號分隔（24 位十六進位）
          example: "5f4dcc3b5aa765d61d8327de,5f4dcc3b5aa765d61d8327df"
        - name: numbers
          in: query
          schema:
            type: string
          description: 依訂單編號篩選，多筆以逗號分隔
          example: "ORD-20260823-0001,ORD-20260823-0002"
        - name: state
          in: query
          schema:
            type: string
            enum:
              - un_pay
              - cod
              - pay
              - failure
              - cancel
          description: |
            依訂單狀態篩選，多筆以逗號分隔。
            `un_pay`（未付款）、`cod`（貨到付款）、`pay`（已付款）、`failure`（付款失敗）、`cancel`（已取消）。
          example: "pay,cod"
        - name: buyer_name
          in: query
          schema:
            type: string
          description: 依購買人姓名篩選
        - name: buyer_email
          in: query
          schema:
            type: string
            format: email
          description: 依購買人電子郵箱篩選
        - name: buyer_mobile
          in: query
          schema:
            type: string
          description: 依購買人手機篩選
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: true
                  orders:
                    type: array
                    items:
                      $ref: "#/components/schemas/Order"
                  pagination:
                    $ref: "#/components/schemas/Pagination"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

    post:
      tags:
        - Orders
      summary: 新增訂單
      description: |
        直接建立訂單（管理員 / 後台用途）。
      operationId: create_order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - order
              properties:
                order:
                  $ref: "#/components/schemas/OrderInput"
      responses:
        "200":
          description: 建立成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: true
                  order:
                    $ref: "#/components/schemas/Order"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/orders/{idOrNumber}:
    get:
      tags:
        - Orders
      summary: 取得單一訂單詳細資訊
      description: |
        `idOrNumber` 可為訂單 ID（24 位十六進位）或訂單編號（如 `ORD-20260823-0001`）。
        回應包含商品圖片資訊。
      operationId: get_order
      parameters:
        - name: idOrNumber
          in: path
          required: true
          schema:
            type: string
          description: 訂單 ID 或訂單編號
          example: "5f4dcc3b5aa765d61d8327de"
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: true
                  order:
                    $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/orders/{id}:
    put:
      tags:
        - Orders
      summary: 更新訂單
      description: 更新訂單資訊（如收件人、物流、備註等）。
      operationId: update_order
      parameters:
        - $ref: "#/components/parameters/OrderIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - order
              properties:
                order:
                  $ref: "#/components/schemas/OrderInput"
      responses:
        "200":
          description: 更新成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: true
                  order:
                    $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

    delete:
      tags:
        - Orders
      summary: 刪除訂單
      description: 永久刪除訂單（不可恢復）。一般業務建議使用「取消」操作代替。
      operationId: delete_order
      parameters:
        - $ref: "#/components/parameters/OrderIdPath"
      responses:
        "200":
          description: 刪除成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/orders/{id}/cancel:
    post:
      tags:
        - Orders
      summary: 取消訂單
      description: 將訂單狀態設為已取消，可選填取消原因。
      operationId: cancel_order
      parameters:
        - $ref: "#/components/parameters/OrderIdPath"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  description: 取消原因（選填）
                  example: "客戶要求取消"
      responses:
        "200":
          description: 取消成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: 訂單狀態不允許取消
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"

