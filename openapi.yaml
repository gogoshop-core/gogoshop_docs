          type: integer
          description: 積分異動量（正為獲得，負為使用）
          example: 50
        balance:
          type: integer
          description: 操作後積分餘額
          example: 200
        reason:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time

    Address:
      type: object
      properties:
        receiver:
          type: object
          properties:
            name:
              type: string
            mobile:
              type: string
            location:
              type: object
              properties:
                country:
                  type: string
                city:
                  type: string
                district:
                  type: string
                zip:
                  type: string
                address:
                  type: string
                province:
                  type: string
                  nullable: true
        shipping:
          type: object
          properties:
            delivery_type:
              type: string
            delivery_name:
              type: string
            fare:
              type: integer
            receive_date:
              type: string
              format: date
              nullable: true
            receive_time:
              type: string
              nullable: true
            pickup_store:
              type: object
              nullable: true
              properties:
                id:
                  type: string
                type:
                  type: string
                name:
                  type: string
                address:
                  type: string

    WishlistItem:
      type: object
      properties:
        id:
          type: string
          pattern: "^[a-f0-9]{24}$"
          description: 願望清單 ID
        product_id:
          type: string
          pattern: "^[a-f0-9]{16}$"
        created_at:
          type: string
          format: date-time

    # ── Delivery ───────────────────────────────────────────────────────────────
    DeliveryInput:
      type: object
      properties:
        delivery_type:
          type: string
          example: "home_delivery"
        delivery_name:
          type: string
          example: "黑貓宅配"
        tracking_number:
          type: string
          nullable: true
        more_params:
          type: object
          description: 物流供應商額外參數（依供應商不同而異）

    Delivery:
      type: object
      properties:
        id:
          type: string
          pattern: "^[a-f0-9]{24}$"
        order_id:
          type: string
          pattern: "^[a-f0-9]{24}$"
        delivery_type:
          type: string
        delivery_name:
          type: string
        tracking_number:
          type: string
          nullable: true
        status:
          type: string
        created_at:
          type: string
          format: date-time

    # ── Cart / Bag ─────────────────────────────────────────────────────────────
    CartItem:
      type: object
      properties:
        id:
          type: string
          description: 購物車項目 ID
        stock_id:
          type: string
        product_id:
          type: string
          pattern: "^[a-f0-9]{16}$"
        product_name:
          type: string
        quantity:
          type: integer
        unit_price:
          type: integer
        comment:
          type: string
          nullable: true

  # ── Reusable Parameters ──────────────────────────────────────────────────────
  parameters:
    PageParam:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
      description: 頁碼

    LimitParam:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        default: 50
      description: 每頁筆數

    MemberIdPath:
      name: id
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-f0-9]{24}$"
      description: 會員 ID（24 位十六進位字串）

    OrderIdPath:
      name: id
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-f0-9]{24}$"
      description: 訂單 ID（24 位十六進位字串）

    ProductIdPath:
      name: id
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-f0-9]{16}$"
      description: 商品 ID（16 位十六進位字串）

    TagIdPath:
      name: id
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-f0-9]{16}$"
      description: 分類 ID（16 位十六進位字串）

    ProductTemplateIdPath:
      name: id
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-f0-9]{16}$"
      description: 商品內文範本 ID（16 位十六進位字串）

  # ── Reusable Responses ───────────────────────────────────────────────────────
  responses:
    Unauthorized:
      description: 身份認證失敗
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            error:
              code: UNAUTHORIZED
              message: "Token is expired or missing"
              details: []

    BadRequest:
      description: 請求參數錯誤或資源不存在
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            error:
              code: VALIDATION_FAILED
              message: "Invalid fields"
              details: []

    InternalError:
      description: 伺服器內部錯誤
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            error:
              code: INTERNAL_SERVER_ERROR
              message: "An unexpected error occurred"
              details: []

# ─── Global Security ──────────────────────────────────────────────────────────
security:
  - BearerAuth: []

# ─── Paths ────────────────────────────────────────────────────────────────────
paths:

  # ════════════════════════════════════════════════════════════════════════════
  # AUTH
  # ════════════════════════════════════════════════════════════════════════════

  /api/v1/auth/access_token:
    post:
      tags:
        - Auth
      summary: 取得 Access Token
      description: |
        使用 `app_id` 與 `app_key` 換取 JWT Bearer Token。
        Token 有效期為 **900 秒（15 分鐘）**，請在到期前呼叫本端點取得新 Token。

        **此端點本身不需要 Bearer Token 認證**。
      operationId: auth_access_token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - app_id
                - app_key
              properties:
                app_id:
                  type: string
                  description: 應用程式 ID
                  example: "{{appId}}"
                app_key:
                  type: string
                  description: 應用程式 API Key（請勿記錄於 log）
                  example: "{{appKey}}"
            example:
              app_id: "abc12345678def01"
              app_key: "sk_live_xxxxxxxxxxxxxxxxxxxxxxxx"
      responses:
        "200":
          description: 成功取得 Token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessTokenResponse"
              example:
                success: true
                access_token: "eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9..."
                token_type: Bearer
                expires_in: 900
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  # ════════════════════════════════════════════════════════════════════════════
  # PRODUCTS
  # ════════════════════════════════════════════════════════════════════════════

  /api/v1/products:
    get:
      tags:
        - Products
      summary: 取得商品列表
      description: 依分頁取得商品列表。
      operationId: list_products
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/LimitParam"
        - name: created_at_min
          in: query
          schema:
            type: string
            pattern: '^\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01]) ([01]\d|2[0-3]):[0-5]\d:[0-5]\d$'
          description: 建立時間下限（YYYY-MM-DD HH:MM:SS）
        - name: created_at_max
          in: query
          schema:
            type: string
            pattern: '^\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01]) ([01]\d|2[0-3]):[0-5]\d:[0-5]\d$'
          description: 建立時間上限（YYYY-MM-DD HH:MM:SS）
        - name: updated_at_min
          in: query
          schema:
            type: string
            pattern: '^\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01]) ([01]\d|2[0-3]):[0-5]\d:[0-5]\d$'
          description: 修改時間下限（YYYY-MM-DD HH:MM:SS）
        - name: updated_at_max
          in: query
          schema:
            type: string
            pattern: '^\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01]) ([01]\d|2[0-3]):[0-5]\d:[0-5]\d$'
          description: 修改時間上限（YYYY-MM-DD HH:MM:SS）
        - name: published_at_min
          in: query
          schema:
            type: string
            pattern: '^\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01]) ([01]\d|2[0-3]):[0-5]\d:[0-5]\d$'
          description: 上架時間下限（YYYY-MM-DD HH:MM:SS）
        - name: published_at_max
          in: query
          schema:
            type: string
            pattern: '^\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01]) ([01]\d|2[0-3]):[0-5]\d:[0-5]\d$'
          description: 上架時間上限（YYYY-MM-DD HH:MM:SS）
        - name: ids
          in: query
          schema:
            type: string
            pattern: "^[0-9a-f,]+$"
          description: 依商品 ID 篩選，多筆以逗號分隔（16 位十六進位）
          example: "1a2b3c4d5e6f7890,1a2b3c4d5e6f7891"
        - name: numbers
          in: query
          schema:
            type: string
          description: 依商品編號篩選，多筆以逗號分隔
          example: "SKU-001,SKU-002"
        - name: state
          in: query
          schema:
            type: string
          description: |
            依商品狀態篩選，多筆以逗號分隔，值請參考 `ProductState`
            （`published`/`publish_check`/`gift`/`cancelled`/`discarded`/`preparative`）。
          example: "published"
        - name: category
          in: query
          schema:
            type: string
          description: 依商品分類篩選，可為 Tag ID（16 位十六進位）或 Tag Code
        - name: query
          in: query
          schema:
            type: string
          description: 搜尋關鍵字
        - name: name
          in: query
          schema:
            type: string
          description: 依商品名稱模糊搜尋（LIKE）
        - name: serial_number
          in: query
          schema:
            type: string
          description: 依商品貨號搜尋，可用空白分隔多個貨號做完全比對（單個則為模糊搜尋）
        - name: vendor_number
          in: query
          schema:
            type: string
          description: 依廠商貨號搜尋，可用空白分隔多個做完全比對（單個則為模糊搜尋）
        - name: marketing_label
          in: query
          schema:
            type: string
          description: 依行銷標籤模糊搜尋（LIKE）
        - name: comment
          in: query
          schema:
            type: string
          description: 依後台備註模糊搜尋（LIKE）
        - name: stock_serial_number
          in: query
          schema:
            type: string
          description: 依規格貨號（stocks.serial_number）模糊搜尋
        - name: tag_name
          in: query
          schema:
            type: string
          description: 依分類名稱（tags.name）完全比對篩選
        - name: search_mode
          in: query
          schema:
            type: string
            enum:
              - literal
              - advanced
              - hybrid
              - vector
            default: advanced
          description: 搜尋模式（僅在提供 query 參數時有效）
        - name: search_disabled
          in: query
          schema:
            type: string
            enum:
              - "0"
              - "1"
              - "false"
              - "true"
          description: 依是否停用搜尋篩選
        - name: order
          in: query
          schema:
            type: string
            enum:
              - price_desc
              - price_asc
              - time_desc
              - time_asc
              - published
              - hot
              - sort_asc
              - sort_desc
              - rand
              - rating_desc
              - score
          description: 排序方式
        - name: sort
          in: query
          schema:
            type: string
            enum:
              - id
              - created
              - modified
              - sort
              - max_price
              - min_price
          description: 依欄位排序（與 `direction` 搭配使用，優先於 `order`）
        - name: direction
          in: query
          schema:
            type: string
            enum:
              - asc
              - desc
            default: desc
          description: 排序方向（需搭配 `sort` 參數使用）
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      products:
                        type: array
                        items:
                          $ref: "#/components/schemas/ProductDetail"
                      pagination:
                        $ref: "#/components/schemas/Pagination"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
