        points_total:
          type: number
          nullable: true
          description: 積分總額
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    MemberInput:
      type: object
      description: 建立或更新會員時使用。新增會員時 `email`、`password` 為必填，且 `name`、`mobile` 須同時提供或同時省略。
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          description: 密碼，僅新增會員時必填
        name:
          type: string
        mobile:
          type: string
        gender:
          type: string
          nullable: true
        birth_year:
          type: string
          example: "1990"
        birth_month:
          type: string
          example: "1"
        birth_day:
          type: string
          example: "15"
        newsletter:
          type: boolean
          description: 是否訂閱電子報
        custom_1:
          type: string
          nullable: true
        custom_2:
          type: string
          nullable: true
        custom_3:
          type: string
          nullable: true
        comment:
          type: string
          nullable: true
        membership_id:
          type: string
          description: 會員等級。可為 guest／member／blacklist，或實際的 membership id（升等成該等級的會員）
        invoice_info:
