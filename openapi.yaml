                  data:
                    type: object
                    properties:
                      products:
                        type: array
                        items:
                          type: object
                          properties:
                            product_id:
                              type: string
                              example: "5bd73df29831ebcf"
                            name:
                              type: string
                              example: "鈕扣針織皺折半身裙 - 2色"
                            serial_number:
                              type: string
                              example: "795321"
                            total_quantity:
                              type: integer
                              example: 30
                            total_amount:
                              type: number
                              example: 15000
                      pagination:
                        $ref: "#/components/schemas/StatsPagination"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  # ════════════════════════════════════════════════════════════════════════════
  # MCP (Model Context Protocol)
  # ════════════════════════════════════════════════════════════════════════════

  /mcp:
    post:
      tags:
        - MCP
      summary: MCP JSON-RPC 請求（新建 Session）
      description: |
        ## Model Context Protocol (MCP) 端點

        本端點實作 [MCP Streamable HTTP Transport](https://spec.modelcontextprotocol.io/specification/2025-03-26/basic/transports/#streamable-http)，
        供 AI Agent（如 Claude、Cursor、MCP Inspector）整合使用。

        ### 認證方式
        與 `/api/v1/*` 不同，`/mcp` 使用**自訂 Header** 認證：
        - `x-gogoshop-app-id`：租戶 App ID
        - `x-gogoshop-app-key`：租戶 App Key

        MCP Server 會自動透過 Tenant Auth Service 換取並快取 JWT Token（存於 Valkey），
        **呼叫端無需手動管理 Token**。

        ### Session 管理
        - 首次請求不帶 `Mcp-Session-Id`，伺服器將建立 Session 並在回應 Header 中回傳 `Mcp-Session-Id`。
        - 後續請求應在 `Mcp-Session-Id` Header 帶入 Session ID 以復用同一 Session。
        - Session 僅存活於記憶體，Pod 重啟後需重新建立。

        ### 支援的 MCP Tools

        | Tool 名稱 | 說明 |
        |-----------|------|
        | `hello` | 回傳當前租戶資訊，用於連線測試 |
        | `revenue_report` | 營收報表 |
        | `coupon_report` | 折扣碼報表 |
        | `member_ranking` | 會員消費排行 |
        | `product_ranking` | 商品銷量排行 |
        | `list_products` | 商品列表 |
        | `get_product` | 商品詳細 |
        | `create_product` | 新增商品 |
        | `update_product` | 更新商品 |
        | `delete_product` | 刪除商品 |
        | `list_orders` | 訂單列表 |
        | `get_order` | 訂單詳細 |
        | `list_members` | 會員列表 |
        | `get_member` | 會員詳細 |
        | `get_member_cash` | 會員購物金紀錄 |
        | `get_member_points` | 會員積分紀錄 |
        | `get_member_addresses` | 會員歷史收件地址 |

        ### JSON-RPC 2.0 格式範例

        **初始化（initialize）**
        ```json
        {
          "jsonrpc": "2.0",
          "id": 1,
          "method": "initialize",
          "params": {
            "protocolVersion": "2025-03-26",
            "capabilities": {},
            "clientInfo": { "name": "my-agent", "version": "1.0.0" }
          }
        }
        ```

        **呼叫 Tool（tools/call）**
        ```json
        {
          "jsonrpc": "2.0",
          "id": 2,
          "method": "tools/call",
          "params": {
            "name": "list_products",
            "arguments": { "page": 1, "limit": 20 }
          }
        }
        ```
      operationId: mcp_post
      security:
        - AppIdHeader: []
          AppKeyHeader: []
      parameters:
        - name: Mcp-Session-Id
          in: header
          required: false
          schema:
            type: string
            format: uuid
          description: |
            MCP Session ID（UUID v4）。
            首次請求時省略，伺服器將自動建立並在回應 Header 中回傳。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: JSON-RPC 2.0 請求
              required:
                - jsonrpc
                - method
              properties:
                jsonrpc:
                  type: string
                  enum:
                    - "2.0"
                id:
                  oneOf:
                    - type: string
                    - type: integer
                  description: 請求 ID（通知訊息可省略）
                method:
                  type: string
                  description: MCP 方法名稱
                  example: "tools/call"
                params:
                  type: object
                  description: 方法參數
            examples:
              initialize:
                summary: 初始化連線
                value:
                  jsonrpc: "2.0"
                  id: 1
                  method: initialize
                  params:
                    protocolVersion: "2025-03-26"
                    capabilities: {}
                    clientInfo:
                      name: "my-agent"
                      version: "1.0.0"
              tools_call:
                summary: 呼叫 list_products
                value:
                  jsonrpc: "2.0"
                  id: 2
                  method: "tools/call"
                  params:
                    name: "list_products"
                    arguments:
                      page: 1
                      limit: 20
              tools_list:
                summary: 列出可用 Tools
                value:
                  jsonrpc: "2.0"
                  id: 3
                  method: "tools/list"
      responses:
        "200":
          description: JSON-RPC 成功回應（或 SSE 串流）
          headers:
            Mcp-Session-Id:
              schema:
                type: string
                format: uuid
              description: Session ID，後續請求應帶入此 Header
          content:
            application/json:
              schema:
                type: object
                description: JSON-RPC 2.0 回應
                required:
                  - jsonrpc
                properties:
                  jsonrpc:
                    type: string
                    enum:
                      - "2.0"
                  id:
                    oneOf:
                      - type: string
                      - type: integer
                  result:
                    type: object
                    description: 成功時的回傳資料
                  error:
                    type: object
                    description: 失敗時的錯誤資訊
                    properties:
                      code:
                        type: integer
                      message:
                        type: string
            text/event-stream:
              schema:
                type: string
                description: SSE 串流格式（用於長連線 / streaming tool 呼叫）
        "401":
          description: 缺少或無效的租戶認證 Header
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Unauthorized: missing x-gogoshop-app-id / x-gogoshop-app-key header"

    get:
      tags:
        - MCP
      summary: MCP SSE 訂閱（復用現有 Session）
      description: |
        使用 GET 方法對現有 Session 建立 SSE（Server-Sent Events）訂閱，
        用於接收伺服器推送的非同步通知（如 heartbeat ping）。

        **必須帶入 `Mcp-Session-Id` Header** 以指定要訂閱的 Session。
      operationId: mcp_get
      security:
        - AppIdHeader: []
          AppKeyHeader: []
      parameters:
        - name: Mcp-Session-Id
          in: header
          required: true
          schema:
            type: string
            format: uuid
          description: 要訂閱的 MCP Session ID
      responses:
        "200":
          description: SSE 串流連線成功
          content:
            text/event-stream:
              schema:
                type: string
                description: Server-Sent Events 串流
        "401":
          description: 缺少或無效的租戶認證 Header
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

    delete:
      tags:
        - MCP
      summary: 關閉 MCP Session
      description: |
        主動關閉並清理指定 Session，釋放伺服器端資源。

        **必須帶入 `Mcp-Session-Id` Header**。
      operationId: mcp_delete
      security:
        - AppIdHeader: []
          AppKeyHeader: []
      parameters:
        - name: Mcp-Session-Id
          in: header
          required: true
          schema:
            type: string
            format: uuid
          description: 要關閉的 MCP Session ID
      responses:
        "200":
          description: Session 已關閉
          content:
            application/json:
              schema:
                type: object
                properties:
                  jsonrpc:
                    type: string
                    example: "2.0"
        "401":
          description: 缺少或無效的租戶認證 Header
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
