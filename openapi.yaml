        newsletter:
          type: boolean
          description: 是否訂閱電子報
        name:
          type: string
          example: "王小明"
        mobile:
          type: string
          example: "0912345678"
        gender:
          type: string
          nullable: true
        birth_year:
          type: string
          example: "1990"
        birth_month:
          type: string
          example: "1"
        birth_day:
          type: string
          example: "15"
        invoice_info:
