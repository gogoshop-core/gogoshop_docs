openapi: "3.1.0"

info:
  title: GOGOSHOP API
  version: "1.0.0"
  description: |
    ## 概述
    GOGOSHOP 是一個 SaaS 多租戶電商平台。本文件涵蓋以下公開 API 端點：

    - **`/api/v1/auth/*`** — 身份驗證，取得 JWT Access Token
    - **`/api/v1/orders/*`** — 訂單管理 CRUD 與進階操作
    - **`/api/v1/products/*`** — 商品管理 CRUD
    - **`/api/v1/members/*`** — 會員管理、購物金、積分、願望清單
    - **`/api/v1/stats/*`** — 報表統計（營業額、活動代碼、會員排名、商品排名）
    - **`/mcp`** — Model Context Protocol (MCP) 端點，供 AI Agent 使用

    ### 1. 基礎資訊 (Base URL)

    所有 API 請求都應發送到以下基礎 URL：

    - **正式環境**: `https://api.gogoshop.io`

    ### 2. 認證機制 (Authentication)

    本 API 採用 **Bearer Token (JWT)** 進行身份驗證。

    - **Header 名稱**: `Authorization`
    - **格式**: `Bearer {{accessToken}}`

    **認證流程**：

    1. 呼叫 `POST /api/v1/auth/access_token`，使用 `app_id` + `app_key` 換取 JWT Token。
    2. 後續所有 `/api/v1/*` 請求，在 `X-Authorization` header 帶入 `Bearer <token>`。
    3. Token 有效期為 **15 分鐘（900 秒）**，請自行實作 Token 自動刷新機制。

    **示例**：

    ```bash
    curl -X GET https://api.gogoshop.io/api/v1/orders \
      -H "X-Authorization: Bearer sYpX...456"
    ```

    > **MCP 端點例外**：`/mcp` 不使用 Bearer Token，改以自訂 Header
    > `x-gogoshop-app-id` / `x-gogoshop-app-key` 進行租戶認證，
    > 由 MCP Server 內部自動換取並快取 Access Token。

    ### 3. 速率限制 (Rate Limiting)

    為了保證服務穩定性，我們對 API 請求進行了頻率限制：

    - **限制規則**: 依租戶方案而定，詳情請洽技術支援。
    - **超過限制**: 若超過頻率，伺服器將回傳 `429 Too Many Requests` 錯誤。

    ### 4. 數據格式 (Data Format)

    - **請求格式**: `application/json`（除特定文件上傳接口外）
    - **回應格式**: `application/json`
    - **日期格式**: 使用 ISO 8601 格式，例如 `YYYY-MM-DD HH:mm:ss`（UTC+8）

    ### 5. 通用狀態碼 (Common Status Codes)

    | 狀態碼 | 說明 | 處理建議 |
    |--------|------|----------|
    | `200` | OK | 請求成功 |
    | `400` | Bad Request | 請求參數錯誤，請檢查 Body 或 Params |
    | `401` | Unauthorized | 身份驗證失敗或 Token 已過期 |
    | `409` | Conflict | 程式符合規範但業務邏輯不允許 |
    | `429` | Too Many Requests | 觸發速率限制，請稍候再試 |
    | `500` | Internal Server Error | 伺服器內部錯誤，請聯繫技術支援 |

    ### 6. 錯誤回應範例 (Error Response)

    當請求失敗時，系統將回傳統一的錯誤格式：

    ```json
    {
        "success": false,
        "error": {
            "code": "VALIDATION_FAILED",
            "message": "手機號碼格式不正確",
            "details": []
        }
    }
    ```

    ### 7. 聯絡技術支援

    如果您在開發過程中遇到任何問題，請透過以下管道聯繫：

    - **Email**: service@gogoshop.io

  contact:
    name: GOGOSHOP 技術支援
    url: https://www.gogoshop.io
    email: service@gogoshop.io
  license:
    name: Proprietary
    identifier: Proprietary

servers:
  - url: https://api.gogoshop.io
    description: Production

tags:
  - name: Auth
    description: 身份驗證 — 取得與更新 JWT Access Token
  - name: Orders
    description: 訂單管理 — CRUD、取消、開立發票、建立出貨單
  - name: Products
    description: 商品管理 — CRUD、商品分類（Tag）管理、商品內文範本（Product Template）管理
  - name: Members
    description: 會員管理 — CRUD、購物金、積分、地址、願望清單
  - name: Stats
    description: 報表 — 營業額、活動代碼、會員排名、商品排名統計
  - name: MCP
    description: Model Context Protocol — AI Agent 整合端點

# ─── Security Schemes ────────────────────────────────────────────────────────
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT Token，透過 `POST /api/v1/auth/access_token` 取得。
        有效期 15 分鐘，請自行實作刷新邏輯。
    AppIdHeader:
      type: apiKey
      in: header
      name: x-gogoshop-app-id
      description: 租戶 App ID（僅用於 `/mcp` 端點）
    AppKeyHeader:
      type: apiKey
      in: header
      name: x-gogoshop-app-key
      description: 租戶 App Key（僅用於 `/mcp` 端點）

  # ─── Reusable Schemas ─────────────────────────────────────────────────────────
  schemas:

    # ── Generic ────────────────────────────────────────────────────────────────
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
      required:
        - success

    ErrorResponse:
      type: object
      required:
        - success
        - error
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              description: 錯誤代碼（SCREAMING_SNAKE_CASE）
              enum:
                - VALIDATION_FAILED
                - RESOURCE_NOT_FOUND
                - PERMISSION_DENIED
                - UNAUTHORIZED
                - BUSINESS_LOGIC_ERROR
                - INTERNAL_SERVER_ERROR
              example: VALIDATION_FAILED
            message:
              type: string
              description: 人類可讀錯誤描述（給開發者閱讀）
              example: "Invalid fields"
            details:
              type: array
              items:
                type: object
              description: 選用，提供欄位層級的驗證錯誤細節
              example: []

    Pagination:
      type: object
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 50

    # ── Stats ──────────────────────────────────────────────────────────────────
    StatsPagination:
      type: object
      properties:
        sort:
          type: string
          example: total_amount
        direction:
          type: string
          example: desc
        page:
          type: integer
          example: 1
        total_count:
          type: integer
          example: 42
        limit:
          type: integer
          example: 20
        page_count:
          type: integer
          example: 3

    # ── Auth ───────────────────────────────────────────────────────────────────
    AccessTokenResponse:
      type: object
      required:
        - success
        - access_token
        - token_type
        - expires_in
      properties:
        success:
          type: boolean
          example: true
        access_token:
          type: string
          description: RS256 簽署的 JWT Token
          example: "eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9..."
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          description: Token 有效秒數
          example: 900

    # ── Product ────────────────────────────────────────────────────────────────
    ProductState:
      type: string
      enum:
        - published
        - publish_check
        - gift
        - cancelled
        - discarded
        - preparative
      description: 商品狀態

    ProductQuantityMode:
      type: string
      enum:
        - stock
        - warehouse
        - unlimited
      description: 庫存扣減模式

    ProductInput:
      type: object
      description: |
        建立或更新商品時使用的欄位。除 `serialNumber`（相容舊版 camelCase，也可用 `serial_number`）外，
        其餘欄位皆以 snake_case 傳入。更新時只需傳入要修改的欄位，未傳入的欄位不會被變更。
      properties:
        type:
          type: string
          description: 商品類型
          example: "default"
        state:
          $ref: "#/components/schemas/ProductState"
        quantity_mode:
          $ref: "#/components/schemas/ProductQuantityMode"
        name:
          type: string
          description: 商品名稱
          example: "經典白 T-shirt"
        serialNumber:
          type: string
          description: 商品序號（亦可使用 `serial_number`）
          example: "SKU-001"
        cost:
          type: integer
          description: 商品成本
          example: 200
        safety_stock:
          type: integer
          description: 安全庫存量
          example: 10
        lead_time:
          type: integer
          minimum: 0
          description: 預備出貨天數（非負整數）
          example: 3
        variant:
          type: array
          items:
            type: string
          description: 商品規格名稱（如顏色、尺寸）
          example: ["顏色", "尺寸"]
        description:
          type: string
          description: 商品描述（支援 HTML）
        published:
          oneOf:
            - type: boolean
            - type: string
              format: date-time
          description: 上架狀態或上架時間
          example: true
        cancelled:
          oneOf:
            - type: boolean
            - type: string
              format: date-time
          description: 下架狀態或下架時間
          example: false
        vendor_number:
          type: string
          nullable: true
          description: 廠商貨號
        link:
          type: string
          nullable: true
        images:
          type: array
          items:
            type: string
        marketing_label:
          type: string
          nullable: true
        media:
          type: integer
          nullable: true
        media_id:
          type: string
          nullable: true
        limited_selections:
          type: array
          items:
            type: string
          description: 限用物流（未選擇則傳空陣列以清空）
        comment_required:
          type: boolean
        comment:
          type: string
        keywords:
          type: string
        meta_description:
          type: string
        settings:
          type: object
          additionalProperties: true
        quantity_limit:
          type: integer
          nullable: true
        fixed_price:
          type: boolean
        search_disabled:
          type: boolean
        sort:
          type: integer
        weight:
          type: number
        warehouse_id:
          type: string
          nullable: true
          description: 追蹤門市 ID（需 Warehouses 進階方案）
        supplier_id:
          type: string
          nullable: true
        stocks:
          type: array
          items:
            $ref: "#/components/schemas/ProductStock"
        tag_ids:
          type: array
          items:
            type: string
          description: 商品分類 Tag ID 陣列
        product_items:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                nullable: true
              sort:
                type: integer
              title:
                type: string
              content:
                type: string
        additions:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                nullable: true
              stock_id:
                type: string
              price:
                type: number
              quantity_limit:
                type: integer
                nullable: true

    ProductStock:
      type: object
      description: 商品庫存（規格 SKU）
      properties:
        id:
          type: string
        serial_number:
          type: string
          example: "SKU-001-WHITE-M"
        variant:
          type: string
          example: "顏色:白 / 尺寸:M"
        image:
          type: string
          nullable: true
        original_price:
          type: number
          example: 500
        selling_price:
          type: number
          example: 450
        quantity:
          type: integer
          example: 10

    Tag:
      type: object
      description: 商品分類（Tag）資源
      properties:
        id:
          type: string
          pattern: "^[a-f0-9]{16}$"
          description: 分類 ID（16 位十六進位）
          example: "1a2b3c4d5e6f7890"
        name:
          type: string
          description: 分類名稱
          example: "上衣"
        code:
          type: string
          description: 分類網址代碼（未指定時預設等於 name）
          example: "shirts"

    TagInput:
      type: object
      description: 建立/更新分類的輸入欄位。更新時只需傳入要修改的欄位。
      properties:
        name:
          type: string
          description: 分類名稱（建立時必填，最多 40 字）
          example: "上衣"
        code:
          type: string
          description: 分類網址代碼（同租戶內須唯一，最多 100 字，未提供則預設等於 name）
          example: "shirts"

    ProductTemplate:
      type: object
      description: 商品內文範本資源，可綁定商品分類（Tag），套用時合併進商品描述/更多內容頁籤
      properties:
        id:
          type: string
          pattern: "^[a-f0-9]{16}$"
          description: 範本 ID（16 位十六進位）
          example: "3c4d5e6f78901a2b"
        tag_id:
          type: string
          nullable: true
          pattern: "^[a-f0-9]{16}$"
          description: 綁定的商品分類 ID，`null` 表示套用於所有商品
          example: "1a2b3c4d5e6f7890"
        sort:
          type: integer
          description: |
            排序值，決定套用方式：
            `101`/`102` 附加於商品描述前/後、`103`/`104` 附加於第一個內文頁籤前/後、其餘（<100）新增為獨立內文頁籤。
          example: 101
        title:
          type: string
          nullable: true
          description: 範本標題
        content:
          type: string
          nullable: true
          description: 範本內容（HTML）

    ProductTemplateInput:
      type: object
      description: 建立/更新商品內文範本的輸入欄位。更新時只需傳入要修改的欄位。
      properties:
        tag_id:
          type: string
          nullable: true
          pattern: "^[a-f0-9]{16}$"
          description: 綁定的商品分類 ID，不指定或傳 `null` 表示套用於所有商品
        sort:
          type: integer
          description: 排序值
          example: 101
        title:
          type: string
          description: 範本標題
        content:
          type: string
          description: 範本內容（HTML）

    Product:
      type: object
      description: 商品資源（snake_case，後端回傳格式）
      properties:
        id:
          type: string
          pattern: "^[a-f0-9]{16}$"
          description: 商品 ID（16 位十六進位）
          example: "1a2b3c4d5e6f7890"
        number:
          type: string
          description: 商品序號
          example: "SKU-001"
        name:
          type: string
          example: "經典白 T-shirt"
        state:
          $ref: "#/components/schemas/ProductState"
        cost:
          type: number
          example: 200
        min_price:
          type: number
          nullable: true
          description: 各規格中的最低售價
          example: 450
        max_price:
          type: number
          nullable: true
          description: 各規格中的最高售價
          example: 500
        review_count:
          type: integer
          description: 評論數量
          example: 0
        avg_rating:
          type: number
          nullable: true
          description: 平均評分
          example: 4.5
        safety_stock:
          type: number
          example: 10
        lead_time:
          type: integer
          description: 預備出貨天數
          example: 3
        description:
          type: string
        variant:
          type: array
          items:
            type: string
          example: ["顏色", "尺寸"]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        published_at:
          oneOf:
            - type: boolean
            - type: string
              format: date-time
          description: 上架狀態或上架時間
        cancelled_at:
          oneOf:
            - type: boolean
            - type: string
              format: date-time
          description: 下架狀態或下架時間
        sort:
          type: integer
          example: 0
        quantity_mode:
          $ref: "#/components/schemas/ProductQuantityMode"
        quantity_limit:
          type: integer
          nullable: true
          description: 限購數量
        fixed_price:
          type: boolean
          description: 是否為固定售價（不因規格而異）
        search_disabled:
          type: boolean
          description: 是否從搜尋結果中隱藏
        link:
          type: string
          nullable: true
        url_path:
          type: string
          example: "classic-white-tshirt"
        vendor_number:
          type: string
          nullable: true
        marketing_label:
          type: string
          nullable: true
        media:
          type: integer
          nullable: true
        media_id:
          type: string
          nullable: true
        limited_selections:
          type: array
          items:
            type: string
          nullable: true
          description: 限用物流
        comment_required:
          type: boolean
          description: 是否必須填寫留言
        comment:
          type: string
        keywords:
          type: string
        meta_description:
          type: string
        settings:
          type: object
          additionalProperties: true
          description: 商品其他設定（結構依商品類型而異）
        images:
          type: array
          items:
            type: string
        type:
          type: string
          enum:
            - default
            - chilled
            - frozen
          description: 商品溫層
        weight:
          type: number
          description: 商品重量
          example: 0.5
        warehouse_id:
          type: string
          nullable: true
          description: 追蹤門市 ID（需 Warehouses 進階方案）
        supplier_id:
          type: string
          nullable: true
        stocks:
          type: array
          items:
            $ref: "#/components/schemas/ProductStock"
        score:
          type: number
          nullable: true

    ProductDetail:
      allOf:
        - $ref: "#/components/schemas/Product"
        - type: object
          description: 詳細商品（含 additions、tags、product_items）
          properties:
            additions:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                  number:
                    type: string
                  name:
                    type: string
                  state:
                    $ref: "#/components/schemas/ProductState"
                  variant:
                    type: string
                  quantity_mode:
                    $ref: "#/components/schemas/ProductQuantityMode"
                  quantity_limit:
                    type: integer
                    nullable: true
                  vendor_number:
                    type: string
                    nullable: true
                  marketing_label:
                    type: string
                    nullable: true
                  comment_required:
                    type: boolean
                  comment:
                    type: string
                  settings:
                    type: object
                    additionalProperties: true
                  images:
                    type: array
                    items:
                      type: string
                  stocks:
                    type: array
                    items:
                      $ref: "#/components/schemas/ProductStock"
            raw_additions:
              type: array
              description: 加購品原始資料（供後台編輯用，含贈品/限購設定）
              items:
                type: object
                properties:
                  id:
                    type: string
                  stock_id:
                    type: string
                  price:
                    type: number
                  quantity_limit:
                    type: integer
                    nullable: true
            tags:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  code:
                    type: string
            product_items:
              type: array
              items:
                type: object
                description: 商品款式（SKU）
                properties:
                  id:
                    type: string
                  sort:
                    type: integer
                  title:
                    type: string
                  content:
                    type: string

    # ── Order ──────────────────────────────────────────────────────────────────
    OrderState:
      type: string
      enum:
        - un_pay
        - cod
        - pay
        - failure
        - cancel
      description: 訂單狀態

    OrderLineItemState:
      type: string
      enum:
        - build
        - done
        - cancel
        - failure
      description: 訂單品項狀態

    OrderLineItem:
      type: object
      description: 訂單品項
      properties:
        id:
          type: string
        product_id:
          type: string
          example: "1a2b3c4d5e6f7890"
        stock_id:
          type: string
        serial_number:
          type: string
          example: "SKU-001-WHITE-M"
        name:
          type: string
          example: "經典白 T-shirt"
        state:
          $ref: "#/components/schemas/OrderLineItemState"
        delivering_quantity:
          type: integer
          example: 0
        delivered_quantity:
          type: integer
          example: 0
        refunding_quantity:
          type: integer
          example: 0
        refunded_quantity:
          type: integer
          example: 0
        quantity:
          type: integer
          example: 2
        original_price:
          type: integer
          example: 500
        selling_price:
          type: integer
          example: 500
        discount:
          type: integer
          example: 0
        price:
          type: integer
          example: 500
        cash:
          type: integer
          example: 0
        amount:
          type: integer
          example: 1000
        comment:
          type: string
          nullable: true
        cancel:
          type: string
          nullable: true
          description: 取消原因（品項被取消時填寫）
        processed_at:
          type: string
          format: date-time
          nullable: true
        delivered_at:
          type: string
          format: date-time
          nullable: true
        cancelled_at:
          type: string
          format: date-time
          nullable: true
        image:
          type: string
          nullable: true
          description: 品項圖片（僅在 require_image 情境下回傳）

    Order:
      type: object
      properties:
        id:
          type: string
          pattern: "^[a-f0-9]{24}$"
          description: 訂單 ID（24 位十六進位）
          example: "5f4dcc3b5aa765d61d8327de"
        number:
          type: string
          description: 訂單編號（人類可讀）
          example: "ORD-20260823-0001"
        state:
          $ref: "#/components/schemas/OrderState"
        currency:
