        - $ref: "#/components/parameters/LimitParam"
        - name: created_from
          in: query
          schema:
            type: string
            format: date
          description: 訂單建立時間起（`YYYY-MM-DD`），預設為當月第一天
        - name: created_to
          in: query
          schema:
            type: string
            format: date
          description: 訂單建立時間迄（`YYYY-MM-DD`），預設為今日
        - name: sort
          in: query
          schema:
            type: string
            enum:
              - coupon_code
              - order_count
              - total_amount
              - average_amount
            default: total_amount
          description: 排序欄位
        - name: direction
          in: query
