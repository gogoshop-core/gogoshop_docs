      description: |
        依商品分組，統計特定區間內的銷售數量與銷售金額。`type=name` 依商品名稱／序號分組（保留歷史名稱），
        `type` 其他值則依 `product_id` 分組並可搭配 `tag_id` 篩選。資料來源為 BigQuery，
        統計對象為 `state` 為 `pay` 或 `cod` 的訂單，且訂單項目狀態為 `build`、`purchase`、`process`、`delivery`。
      operationId: product_ranking
      parameters:
