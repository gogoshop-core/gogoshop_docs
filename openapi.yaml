  # ════════════════════════════════════════════════════════════════════════════
  # MEMBERS
  # ════════════════════════════════════════════════════════════════════════════

  /api/v1/members:
    get:
      tags:
        - Members
      summary: 取得會員列表
      description: 依分頁與篩選條件取得會員列表。
      operationId: list_members
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 50
          description: 每頁筆數（最大 500）
        - name: created_at_min
          in: query
          schema:
            type: string
            pattern: '^\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01]) ([01]\d|2[0-3]):[0-5]\d:[0-5]\d$'
          description: 建立時間下限（YYYY-MM-DD HH:MM:SS）
        - name: created_at_max
          in: query
          schema:
            type: string
            pattern: '^\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01]) ([01]\d|2[0-3]):[0-5]\d:[0-5]\d$'
          description: 建立時間上限（YYYY-MM-DD HH:MM:SS）
        - name: updated_at_min
          in: query
          schema:
            type: string
            pattern: '^\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01]) ([01]\d|2[0-3]):[0-5]\d:[0-5]\d$'
          description: 更新時間下限（YYYY-MM-DD HH:MM:SS）
        - name: updated_at_max
          in: query
          schema:
            type: string
            pattern: '^\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01]) ([01]\d|2[0-3]):[0-5]\d:[0-5]\d$'
          description: 更新時間上限（YYYY-MM-DD HH:MM:SS）
        - name: ids
          in: query
          schema:
            type: string
            pattern: "^[0-9a-f,]+$"
          description: 依會員 ID 清單篩選，逗號分隔（如 `id1,id2`）
        - name: birth_month
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 12
          description: 依生日月份篩選（1–12）
        - name: notifiable_wishlist_product_id
          in: query
          schema:
            type: string
            pattern: "^[0-9a-f]{16}$"
          description: 篩選已將此商品加入願望清單且尚未通知的會員（16 位商品 ID）
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: true
                  members:
                    type: array
                    items:
                      $ref: "#/components/schemas/Member"
                  pagination:
                    $ref: "#/components/schemas/Pagination"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

    post:
      tags:
        - Members
      summary: 新增會員
      description: 建立新會員。
      operationId: create_member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - member
              properties:
                member:
                  $ref: "#/components/schemas/MemberInput"
            example:
              member:
                email: "newuser@example.com"
                name: "陳大文"
                mobile: "0987654321"
                country: "TW"
      responses:
        "200":
          description: 建立成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  member:
                    $ref: "#/components/schemas/Member"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/members/{idOrEmail}:
    get:
      tags:
        - Members
      summary: 取得單一會員
      description: |
        `idOrEmail` 可為：
        - **會員 ID**：24 位十六進位字串（`[0-9a-f]{24}`）
        - **Email**：會員的電子郵件地址
      operationId: get_member
      parameters:
        - name: idOrEmail
          in: path
          required: true
          schema:
            type: string
          description: 會員 ID（24 位十六進位）或 Email
          example: "member@example.com"
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: true
                  member:
                    $ref: "#/components/schemas/Member"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/members/{id}:
    put:
      tags:
        - Members
      summary: 更新會員資料
      description: 更新指定會員資料，只需傳入要更新的欄位。
      operationId: update_member
      parameters:
        - $ref: "#/components/parameters/MemberIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - member
              properties:
                member:
                  $ref: "#/components/schemas/MemberInput"
      responses:
        "200":
          description: 更新成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: true
                  member:
                    $ref: "#/components/schemas/Member"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

    delete:
      tags:
        - Members
      summary: 刪除會員
      description: 永久刪除指定會員帳號。
      operationId: delete_member
      parameters:
        - $ref: "#/components/parameters/MemberIdPath"
      responses:
        "200":
          description: 刪除成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/members/{id}/cash:
    get:
      tags:
        - Members
      summary: 取得會員購物金紀錄
      description: 查詢指定會員的購物金異動紀錄，回應包含 `total_cash` 當前累計餘額。
      operationId: get_member_cash
      parameters:
        - $ref: "#/components/parameters/MemberIdPath"
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/LimitParam"
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: true
                  cash:
                    type: array
                    items:
                      $ref: "#/components/schemas/CashRecord"
                  pagination:
                    $ref: "#/components/schemas/Pagination"
                  total_cash:
                    type: integer
                    description: 購物金當前餘額
                    example: 500
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

    post:
      tags:
        - Members
      summary: 新增購物金
      description: |
        為指定會員增加（或減少）購物金。
        - `cash` 為必填欄位，正值為存入，負值為扣除。
        - 可選填 `expired`（到期時間）與 `reason`（原因）。
      operationId: add_member_cash
      parameters:
        - $ref: "#/components/parameters/MemberIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - cash
              properties:
                cash:
                  type: integer
                  description: 購物金異動量（正：存入；負：扣除）
                  example: 100
                expired:
                  type: string
                  format: date-time
                  description: 到期時間（選填）
                  example: "2027-12-31T23:59:59+08:00"
                reason:
                  type: string
                  description: 操作原因（選填）
                  example: "促銷活動贈送"
      responses:
        "200":
          description: 操作成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/members/{id}/points:
    get:
      tags:
        - Members
      summary: 取得會員積分紀錄
      description: 查詢指定會員的積分異動紀錄（分頁）。
      operationId: get_member_points
      parameters:
        - $ref: "#/components/parameters/MemberIdPath"
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/LimitParam"
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: true
                  points:
                    type: array
                    items:
                      $ref: "#/components/schemas/PointRecord"
                  pagination:
                    $ref: "#/components/schemas/Pagination"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

    post:
      tags:
        - Members
      summary: 新增積分
      description: |
        為指定會員增加積分。
        - `points` 為必填欄位，僅支援正值（增加）。
        - 可選填 `reason`（原因）。
      operationId: add_member_points
      parameters:
        - $ref: "#/components/parameters/MemberIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - points
              properties:
                points:
                  type: integer
                  minimum: 1
                  description: 增加的積分量
                  example: 50
                reason:
                  type: string
                  description: 操作原因（選填）
                  example: "購物回饋積分"
      responses:
        "200":
          description: 操作成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/members/{id}/addresses:
    get:
      tags:
        - Members
      summary: 取得會員歷史收件地址
      description: |
        依照會員的歷史訂單推導收件地址。所有篩選條件均為**精確比對**（非模糊搜尋），
        空字串視為未帶入。若查無符合條件的訂單，回傳 `status: false`。
      operationId: get_member_addresses
      parameters:
        - $ref: "#/components/parameters/MemberIdPath"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
          description: 取最近 N 筆訂單（預設 1）
        - name: receiver_country
          in: query
          schema:
            type: string
          description: 精確比對收件國家
        - name: receiver_name
          in: query
          schema:
            type: string
          description: 精確比對收件人姓名
        - name: delivery_type
          in: query
          schema:
            type: string
          description: 精確比對物流類型
        - name: delivery_name
          in: query
          schema:
            type: string
          description: 精確比對物流名稱
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: true
                  addresses:
                    type: array
                    items:
                      $ref: "#/components/schemas/Address"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/members/{id}/wishlists:
    get:
      tags:
        - Members
      summary: 取得會員願望清單
      description: 查詢指定會員的願望清單商品。
      operationId: get_member_wishlists
      parameters:
        - $ref: "#/components/parameters/MemberIdPath"
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: true
                  wishlists:
                    type: array
                    items:
                      $ref: "#/components/schemas/WishlistItem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

    post:
      tags:
        - Members
      summary: 加入願望清單
      description: 將商品加入指定會員的願望清單。
      operationId: create_member_wishlist
      parameters:
        - $ref: "#/components/parameters/MemberIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - product_id
              properties:
                product_id:
                  type: string
                  pattern: "^[a-f0-9]{16}$"
                  description: 商品 ID（16 位十六進位）
                  example: "1a2b3c4d5e6f7890"
      responses:
        "200":
          description: 加入成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/members/{id}/wishlists/{wishlistId}:
    delete:
      tags:
        - Members
      summary: 移除願望清單項目
      description: 從指定會員的願望清單中移除商品。
      operationId: delete_member_wishlist
      parameters:
        - $ref: "#/components/parameters/MemberIdPath"
        - name: wishlistId
          in: path
          required: true
          schema:
            type: string
            pattern: "^[a-f0-9]{24}$"
          description: 願望清單項目 ID（24 位十六進位）
      responses:
        "200":
          description: 移除成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  # ════════════════════════════════════════════════════════════════════════════
  # STATS（報表）
  # ════════════════════════════════════════════════════════════════════════════

  /api/v1/stats/revenue_report:
    get:
      tags:
        - Stats
      summary: 期間營業報表
      description: |
        依區間統計訂單營收與退款金額，可依 `period` 指定分組粒度（小時／星期／日／月／年）。
        資料來源為 BigQuery，統計對象為 `state` 為 `pay` 或 `cod` 的訂單。
      operationId: revenue_report
      parameters:
        - name: created_from
          in: query
          schema:
            type: string
            format: date
          description: 訂單建立時間起（`YYYY-MM-DD`），預設為當月第一天
          example: "2026-08-01"
        - name: created_to
          in: query
          schema:
            type: string
            format: date
          description: 訂單建立時間迄（`YYYY-MM-DD`），預設為今日
          example: "2026-08-24"
        - name: period
          in: query
          schema:
            type: string
            enum:
              - hour
              - day_of_week
              - day
              - month
              - year
            default: day
          description: 統計分組粒度
        - name: referrer_code
          in: query
          schema:
            type: string
          description: 選填，依推薦代碼（`referrer` 或 `network_id`）篩選訂單
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      ordersStat:
                        type: array
                        items:
                          type: object
                          properties:
                            period:
                              type: string
