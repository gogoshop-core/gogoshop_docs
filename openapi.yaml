        receiver_mobile:
          type: string
        receiver_country:
          type: string
        receiver_city:
          type: string
        receiver_district:
          type: string
        receiver_zip:
          type: string
        receiver_address:
          type: string
        delivery_type:
          type: string
        delivery_name:
