  # ════════════════════════════════════════════════════════════════════════════
  # ORDERS
  # ════════════════════════════════════════════════════════════════════════════

  /api/v1/orders:
    get:
      tags:
        - Orders
      summary: 取得訂單列表
      description: 依分頁與篩選條件取得訂單列表。
      operationId: list_orders
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/LimitParam"
        - name: created_at_min
          in: query
          schema:
            type: string
            pattern: '^\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01]) ([01]\d|2[0-3]):[0-5]\d:[0-5]\d$'
          description: 建立時間下限（YYYY-MM-DD HH:MM:SS）
        - name: created_at_max
          in: query
          schema:
            type: string
            pattern: '^\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01]) ([01]\d|2[0-3]):[0-5]\d:[0-5]\d$'
          description: 建立時間上限（YYYY-MM-DD HH:MM:SS）
        - name: updated_at_min
          in: query
          schema:
            type: string
            pattern: '^\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01]) ([01]\d|2[0-3]):[0-5]\d:[0-5]\d$'
          description: 修改時間下限（YYYY-MM-DD HH:MM:SS）
        - name: updated_at_max
          in: query
          schema:
            type: string
            pattern: '^\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01]) ([01]\d|2[0-3]):[0-5]\d:[0-5]\d$'
          description: 修改時間上限（YYYY-MM-DD HH:MM:SS）
        - name: paid_at_min
          in: query
          schema:
            type: string
            pattern: '^\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01]) ([01]\d|2[0-3]):[0-5]\d:[0-5]\d$'
          description: 付款時間下限（YYYY-MM-DD HH:MM:SS）
        - name: paid_at_max
          in: query
          schema:
            type: string
            pattern: '^\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01]) ([01]\d|2[0-3]):[0-5]\d:[0-5]\d$'
          description: 付款時間上限（YYYY-MM-DD HH:MM:SS）
        - name: ids
          in: query
          schema:
            type: string
            pattern: "^[0-9a-f,]+$"
          description: 依訂單 ID 篩選，多筆以逗號分隔（24 位十六進位）
          example: "5f4dcc3b5aa765d61d8327de,5f4dcc3b5aa765d61d8327df"
        - name: numbers
          in: query
          schema:
            type: string
          description: 依訂單編號篩選，多筆以逗號分隔
          example: "ORD-20260823-0001,ORD-20260823-0002"
        - name: state
          in: query
          schema:
            type: string
            enum:
              - un_pay
              - cod
              - pay
              - failure
              - cancel
          description: |
            依訂單狀態篩選，多筆以逗號分隔。
            `un_pay`（未付款）、`cod`（貨到付款）、`pay`（已付款）、`failure`（付款失敗）、`cancel`（已取消）。
          example: "pay,cod"
        - name: buyer_name
          in: query
          schema:
            type: string
          description: 依購買人姓名篩選
        - name: buyer_email
          in: query
          schema:
            type: string
            format: email
          description: 依購買人電子郵箱篩選
        - name: buyer_mobile
          in: query
          schema:
            type: string
          description: 依購買人手機篩選
        - name: keyword
          in: query
          schema:
            type: string
          description: 搜尋關鍵字，需搭配 `search` 指定搜尋欄位
        - name: search
          in: query
          schema:
            type: string
            enum:
              - serial_number
              - product.serial_number
              - product.name
              - coupon_code
              - referrer_code
              - buyer_email
              - name
              - mobile
              - comment
              - delivery_name
          description: |
            搭配 `keyword` 使用，指定搜尋的欄位/範圍。
            `serial_number`（訂單編號）、`product.serial_number`（商品貨號）、`product.name`（商品名稱）、
            `coupon_code`（活動代碼）、`referrer_code`（分銷代碼）、`buyer_email`（購買人 email）、
            `name`（購買人或收件人姓名）、`mobile`（購買人或收件人手機）、`comment`（備註）、`delivery_name`（配送方式/門市名稱）。
          example: "product.name"
        - name: receive_date_min
          in: query
          schema:
            type: string
            format: date
          description: 到貨日期下限（YYYY-MM-DD）
        - name: receive_date_max
          in: query
          schema:
            type: string
            format: date
          description: 到貨日期上限（YYYY-MM-DD）
        - name: invoice_date_min
          in: query
          schema:
            type: string
            format: date
          description: 發票日期下限（YYYY-MM-DD）
        - name: invoice_date_max
          in: query
          schema:
            type: string
            format: date
          description: 發票日期上限（YYYY-MM-DD）
        - name: model
          in: query
          schema:
            type: string
            enum:
              - PayableOrders
              - DeliverableOrders
              - InvoiceableOrders
          description: |
            依訂單清單類型套用預設篩選條件。
            `PayableOrders`（待付款：未付款/貨到付款訂單）、
            `DeliverableOrders`（待出貨：已付款/貨到付款且尚未出貨、且商品已備貨或已採購的訂單）、
            `InvoiceableOrders`（待開發票：台幣、已付款/貨到付款、且發票類型為二聯或三聯的訂單）。
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: true
                  orders:
                    type: array
                    items:
                      $ref: "#/components/schemas/Order"
                  pagination:
                    $ref: "#/components/schemas/Pagination"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

    post:
      tags:
        - Orders
      summary: 新增訂單
      description: |
        直接建立訂單（管理員 / 後台用途）。
      operationId: create_order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - order
              properties:
                order:
                  $ref: "#/components/schemas/OrderInput"
      responses:
        "200":
          description: 建立成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: true
                  order:
                    $ref: "#/components/schemas/Order"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/orders/{idOrNumber}:
    get:
      tags:
        - Orders
      summary: 取得單一訂單詳細資訊
      description: |
        `idOrNumber` 可為訂單 ID（24 位十六進位）或訂單編號（如 `ORD-20260823-0001`）。
        回應包含商品圖片資訊。
      operationId: get_order
      parameters:
        - name: idOrNumber
          in: path
          required: true
          schema:
            type: string
          description: 訂單 ID 或訂單編號
          example: "5f4dcc3b5aa765d61d8327de"
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: true
                  order:
                    $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/orders/{id}:
    put:
      tags:
        - Orders
      summary: 更新訂單
      description: 更新訂單資訊（如收件人、物流、備註等）。
      operationId: update_order
      parameters:
        - $ref: "#/components/parameters/OrderIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - order
              properties:
                order:
                  $ref: "#/components/schemas/OrderInput"
      responses:
        "200":
          description: 更新成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: true
                  order:
                    $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

    delete:
      tags:
        - Orders
      summary: 刪除訂單
      description: 永久刪除訂單（不可恢復）。一般業務建議使用「取消」操作代替。
      operationId: delete_order
      parameters:
        - $ref: "#/components/parameters/OrderIdPath"
      responses:
        "200":
          description: 刪除成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/orders/pay:
    post:
      tags:
        - Orders
      summary: 批次標記付款成功
      description: 一次呼叫，將多筆訂單依 id 標記為付款成功，取代逐筆呼叫。
      operationId: pay_orders
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - order_ids
              properties:
                order_ids:
                  type: array
                  items:
                    type: string
                  description: 訂單 id 清單
                  example: ["651f1c2e9a1b2c3d4e5f6789", "651f1c2e9a1b2c3d4e5f678a"]
                paid:
                  type: string
                  description: 付款時間，未提供則使用當下時間
                  example: "2026-08-23 12:00:00"
      responses:
        "200":
          description: 處理完成（個別訂單失敗不影響整體回應，詳見 failed）
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: true
                  failed:
                    type: array
                    description: 標記失敗的訂單清單
                    items:
                      type: object
                      properties:
                        order_id:
                          type: string
                        errorMessage:
                          type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/orders/{id}/cancel:
    post:
      tags:
        - Orders
      summary: 取消訂單
      description: 將訂單狀態設為已取消，可選填取消原因。
      operationId: cancel_order
      parameters:
        - $ref: "#/components/parameters/OrderIdPath"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  description: 取消原因（選填）
                  example: "客戶要求取消"
      responses:
        "200":
          description: 取消成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: 訂單狀態不允許取消
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"

