  # ════════════════════════════════════════════════════════════════════════════
  # STATS（報表）
  # ════════════════════════════════════════════════════════════════════════════

  /api/v1/stats/revenue_report:
    get:
      tags:
        - Stats
      summary: 期間營業報表
      description: |
        依區間統計訂單營收與退款金額，可依 `period` 指定分組粒度（小時／星期／日／月／年）。
        資料來源為 BigQuery，統計對象為 `state` 為 `pay` 或 `cod` 的訂單。
      operationId: revenue_report
      parameters:
        - name: created_from
          in: query
          schema:
            type: string
            format: date
          description: 訂單建立時間起（`YYYY-MM-DD`），預設為當月第一天
          example: "2026-08-01"
        - name: created_to
          in: query
          schema:
            type: string
            format: date
          description: 訂單建立時間迄（`YYYY-MM-DD`），預設為今日
          example: "2026-08-24"
        - name: period
          in: query
          schema:
            type: string
            enum:
              - hour
              - day_of_week
              - day
              - month
              - year
            default: day
          description: 統計分組粒度
        - name: referrer_code
          in: query
          schema:
            type: string
          description: 選填，依推薦代碼（`referrer` 或 `network_id`）篩選訂單
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      ordersStat:
                        type: array
                        items:
                          type: object
                          properties:
                            period:
                              type: string
                              example: "2026-08-24"
                            quantity:
                              type: integer
                              example: 12
                            price:
                              type: number
                              example: 850.5
                            amount:
                              type: number
                              example: 10206
                            fare:
                              type: number
                              example: 600
                            payment_fee:
                              type: number
                              example: 60
                      refundsStat:
                        type: array
                        items:
                          type: object
                          properties:
                            period:
                              type: string
                              example: "2026-08-24"
                            refund_amount:
                              type: number
                              example: 500
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/stats/coupon_report:
    get:
      tags:
        - Stats
      summary: 活動代碼報表
      description: |
        依 `coupon_code` 分組，統計特定區間內使用該活動代碼訂單的訂單數、銷售額、平均客單價。
        資料來源為 BigQuery，統計對象為 `state` 為 `pay` 或 `cod` 的訂單。
      operationId: coupon_report
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/LimitParam"
        - name: created_from
          in: query
          schema:
            type: string
            format: date
          description: 訂單建立時間起（`YYYY-MM-DD`），預設為當月第一天
        - name: created_to
          in: query
          schema:
            type: string
            format: date
          description: 訂單建立時間迄（`YYYY-MM-DD`），預設為今日
        - name: sort
          in: query
          schema:
            type: string
            enum:
              - coupon_code
              - order_count
              - total_amount
              - average_amount
            default: total_amount
          description: 排序欄位
        - name: direction
          in: query
          schema:
            type: string
            enum:
              - asc
              - desc
            default: desc
          description: 排序方向
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: true
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      coupons:
                        type: array
                        items:
                          type: object
                          properties:
                            coupon_code:
                              type: string
                              example: "vip"
                            order_count:
                              type: integer
                              example: 8
                            total_amount:
                              type: number
                              example: 6800
                            average_amount:
                              type: number
                              example: 850
                      pagination:
                        $ref: "#/components/schemas/StatsPagination"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/stats/member_ranking:
    get:
      tags:
        - Stats
      summary: 會員消費排名
      description: |
        依會員（`buyer_name` / `buyer_email`）分組，統計特定區間內的購買次數、總消費金額（不含運費）、
        平均客單價、退貨次數、退貨金額。資料來源為 BigQuery。
      operationId: member_ranking
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/LimitParam"
        - name: created_from
          in: query
          schema:
            type: string
            format: date
          description: 訂單建立時間起（`YYYY-MM-DD`），預設為當月第一天
        - name: created_to
          in: query
          schema:
            type: string
            format: date
          description: 訂單建立時間迄（`YYYY-MM-DD`），預設為今日
        - name: sort
          in: query
          schema:
            type: string
            enum:
              - buyer_name
              - buyer_email
              - order_count
              - total_amount
              - average_amount
              - refund_count
              - refund_amount
            default: total_amount
          description: 排序欄位
        - name: direction
          in: query
          schema:
            type: string
            enum:
              - asc
              - desc
            default: desc
          description: 排序方向
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: true
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      members:
                        type: array
                        items:
                          type: object
                          properties:
                            buyer_name:
                              type: string
                              example: "林裕得"
                            buyer_email:
                              type: string
                              example: "hydelin@gmail.com"
                            order_count:
                              type: integer
                              example: 5
                            total_amount:
                              type: number
                              example: 4250
                            average_amount:
                              type: number
                              example: 850
                            refund_count:
                              type: integer
                              example: 1
                            refund_amount:
                              type: number
                              example: 500
                      pagination:
                        $ref: "#/components/schemas/StatsPagination"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/stats/product_ranking:
    get:
      tags:
        - Stats
      summary: 商品銷量排名
      description: |
        依商品分組，統計特定區間內的銷售數量與銷售金額。`type=name` 依商品名稱／序號分組（保留歷史名稱），
        `type` 其他值則依 `product_id` 分組並可搭配 `tag_id` 篩選。資料來源為 BigQuery，
        統計對象為 `state` 為 `pay` 或 `cod` 的訂單，且訂單項目狀態為 `build`、`purchase`、`process`、`delivery`。
      operationId: product_ranking
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/LimitParam"
        - name: created_from
          in: query
          schema:
            type: string
            format: date
          description: 訂單建立時間起（`YYYY-MM-DD`），預設為當月第一天
        - name: created_to
          in: query
          schema:
            type: string
            format: date
          description: 訂單建立時間迄（`YYYY-MM-DD`），預設為今日
        - name: type
          in: query
          schema:
            type: string
            default: name
          description: 分組方式，`name` 依商品名稱／序號分組，其他值依 `product_id` 分組
        - name: tag_id
          in: query
          schema:
            type: string
          description: 選填，依商品標籤 ID 篩選
        - name: referrer_code
          in: query
          schema:
            type: string
          description: 選填，依推薦代碼（`referrer` 或 `network_id`）篩選訂單
        - name: sort
          in: query
          schema:
            type: string
            enum:
              - total_amount
              - total_quantity
              - product_id
              - name
              - serial_number
            default: total_amount
          description: 排序欄位
        - name: direction
          in: query
          schema:
            type: string
            enum:
              - asc
              - desc
            default: desc
          description: 排序方向
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: true
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      products:
                        type: array
                        items:
                          type: object
                          properties:
                            product_id:
                              type: string
                              example: "5bd73df29831ebcf"
                            name:
                              type: string
                              example: "鈕扣針織皺折半身裙 - 2色"
                            serial_number:
                              type: string
                              example: "795321"
                            total_quantity:
                              type: integer
                              example: 30
                            total_amount:
                              type: number
                              example: 15000
                      pagination:
                        $ref: "#/components/schemas/StatsPagination"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  # ════════════════════════════════════════════════════════════════════════════
  # MCP (Model Context Protocol)
  # ════════════════════════════════════════════════════════════════════════════

  /mcp:
    post:
      tags:
        - MCP
      summary: MCP JSON-RPC 請求（新建 Session）
      description: |
        ## Model Context Protocol (MCP) 端點

        本端點實作 [MCP Streamable HTTP Transport](https://spec.modelcontextprotocol.io/specification/2025-03-26/basic/transports/#streamable-http)，
        供 AI Agent（如 Claude、Cursor、MCP Inspector）整合使用。

        ### 認證方式
        與 `/api/v1/*` 不同，`/mcp` 使用**自訂 Header** 認證：
        - `x-gogoshop-app-id`：租戶 App ID
        - `x-gogoshop-app-key`：租戶 App Key

        MCP Server 會自動透過 Tenant Auth Service 換取並快取 JWT Token（存於 Valkey），
        **呼叫端無需手動管理 Token**。

        ### Session 管理
        - 首次請求不帶 `Mcp-Session-Id`，伺服器將建立 Session 並在回應 Header 中回傳 `Mcp-Session-Id`。
        - 後續請求應在 `Mcp-Session-Id` Header 帶入 Session ID 以復用同一 Session。
        - Session 僅存活於記憶體，Pod 重啟後需重新建立。

        ### 支援的 MCP Tools

        | Tool 名稱 | 說明 |
        |-----------|------|
        | `hello` | 回傳當前租戶資訊，用於連線測試 |
        | `revenue_report` | 營收報表 |
        | `coupon_report` | 折扣碼報表 |
        | `member_ranking` | 會員消費排行 |
        | `product_ranking` | 商品銷量排行 |
        | `list_products` | 商品列表 |
        | `get_product` | 商品詳細 |
        | `create_product` | 新增商品 |
        | `update_product` | 更新商品 |
        | `delete_product` | 刪除商品 |
        | `list_orders` | 訂單列表 |
        | `get_order` | 訂單詳細 |
        | `list_members` | 會員列表 |
        | `get_member` | 會員詳細 |
        | `get_member_cash` | 會員購物金紀錄 |
        | `get_member_points` | 會員積分紀錄 |
        | `get_member_addresses` | 會員歷史收件地址 |

        ### JSON-RPC 2.0 格式範例

        **初始化（initialize）**
        ```json
        {
          "jsonrpc": "2.0",
          "id": 1,
          "method": "initialize",
          "params": {
            "protocolVersion": "2025-03-26",
            "capabilities": {},
            "clientInfo": { "name": "my-agent", "version": "1.0.0" }
          }
        }
        ```

        **呼叫 Tool（tools/call）**
        ```json
        {
          "jsonrpc": "2.0",
          "id": 2,
          "method": "tools/call",
          "params": {
            "name": "list_products",
            "arguments": { "page": 1, "limit": 20 }
          }
        }
        ```
      operationId: mcp_post
      security:
        - AppIdHeader: []
          AppKeyHeader: []
      parameters:
        - name: Mcp-Session-Id
          in: header
          required: false
          schema:
            type: string
            format: uuid
          description: |
            MCP Session ID（UUID v4）。
            首次請求時省略，伺服器將自動建立並在回應 Header 中回傳。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: JSON-RPC 2.0 請求
              required:
                - jsonrpc
                - method
              properties:
                jsonrpc:
                  type: string
                  enum:
                    - "2.0"
                id:
                  oneOf:
                    - type: string
                    - type: integer
                  description: 請求 ID（通知訊息可省略）
                method:
                  type: string
                  description: MCP 方法名稱
                  example: "tools/call"
                params:
                  type: object
                  description: 方法參數
            examples:
              initialize:
                summary: 初始化連線
                value:
                  jsonrpc: "2.0"
                  id: 1
                  method: initialize
                  params:
                    protocolVersion: "2025-03-26"
                    capabilities: {}
                    clientInfo:
                      name: "my-agent"
                      version: "1.0.0"
              tools_call:
                summary: 呼叫 list_products
                value:
                  jsonrpc: "2.0"
                  id: 2
                  method: "tools/call"
                  params:
                    name: "list_products"
                    arguments:
                      page: 1
                      limit: 20
              tools_list:
                summary: 列出可用 Tools
                value:
                  jsonrpc: "2.0"
                  id: 3
                  method: "tools/list"
      responses:
        "200":
          description: JSON-RPC 成功回應（或 SSE 串流）
          headers:
            Mcp-Session-Id:
              schema:
                type: string
                format: uuid
              description: Session ID，後續請求應帶入此 Header
          content:
            application/json:
              schema:
                type: object
                description: JSON-RPC 2.0 回應
                required:
                  - jsonrpc
                properties:
                  jsonrpc:
                    type: string
                    enum:
                      - "2.0"
                  id:
                    oneOf:
                      - type: string
                      - type: integer
                  result:
                    type: object
                    description: 成功時的回傳資料
                  error:
                    type: object
                    description: 失敗時的錯誤資訊
                    properties:
                      code:
                        type: integer
                      message:
                        type: string
            text/event-stream:
              schema:
                type: string
                description: SSE 串流格式（用於長連線 / streaming tool 呼叫）
        "401":
          description: 缺少或無效的租戶認證 Header
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Unauthorized: missing x-gogoshop-app-id / x-gogoshop-app-key header"

    get:
      tags:
        - MCP
      summary: MCP SSE 訂閱（復用現有 Session）
      description: |
        使用 GET 方法對現有 Session 建立 SSE（Server-Sent Events）訂閱，
        用於接收伺服器推送的非同步通知（如 heartbeat ping）。

        **必須帶入 `Mcp-Session-Id` Header** 以指定要訂閱的 Session。
      operationId: mcp_get
      security:
        - AppIdHeader: []
          AppKeyHeader: []
      parameters:
        - name: Mcp-Session-Id
          in: header
          required: true
          schema:
            type: string
            format: uuid
          description: 要訂閱的 MCP Session ID
      responses:
        "200":
          description: SSE 串流連線成功
          content:
            text/event-stream:
              schema:
                type: string
                description: Server-Sent Events 串流
        "401":
          description: 缺少或無效的租戶認證 Header
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

    delete:
      tags:
        - MCP
      summary: 關閉 MCP Session
      description: |
        主動關閉並清理指定 Session，釋放伺服器端資源。

        **必須帶入 `Mcp-Session-Id` Header**。
      operationId: mcp_delete
      security:
        - AppIdHeader: []
          AppKeyHeader: []
      parameters:
        - name: Mcp-Session-Id
          in: header
          required: true
          schema:
            type: string
            format: uuid
          description: 要關閉的 MCP Session ID
      responses:
        "200":
          description: Session 已關閉
          content:
            application/json:
              schema:
                type: object
                properties:
                  jsonrpc:
                    type: string
                    example: "2.0"
        "401":
          description: 缺少或無效的租戶認證 Header
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
