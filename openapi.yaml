  /api/v1/product_templates:
    get:
      tags:
        - Products
      summary: 取得商品內文範本列表
      description: |
        取得商品內文範本（Product Template）列表，不分頁。
        範本可依 `tag_id` 綁定特定商品分類，未綁定分類的範本（`tag_id` 為 `null`）套用於所有商品。
      operationId: list_product_templates
      parameters:
        - name: tag_ids
          in: query
          schema:
            type: string
            pattern: "^[a-f0-9,]*$"
          description: |
            依商品分類 ID 篩選，多筆以逗號分隔。
            回傳結果為「未綁定分類（`tag_id` 為 `null`）」與「綁定於指定分類」的範本聯集；
            若未提供此參數，僅回傳未綁定分類的範本。
          example: "1a2b3c4d5e6f7890,2b3c4d5e6f789012"
      responses:
        "200":
          description: 成功取得商品內文範本列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      product_templates:
                        type: array
