        refunds:
          type: array
          items:
            type: object
            additionalProperties: true

    OrderInput:
      type: object
      description: |
        建立或更新訂單時使用。新增訂單時，扣庫存、建立訂單、現金付款標記與資料庫交易皆整合在同一個
        原子交易內完成。
      properties:
